<body class="bg-slate-950 text-slate-100 font-sans selection:bg-indigo-500 selection:text-white overflow-hidden">
  <div id="root" class="h-screen w-screen flex flex-col"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useMemo, useRef } from 'react';
    import { createRoot } from 'react-dom/client';
    import { createClient } from '@supabase/supabase-js';
    import Papa from 'https://esm.sh/papaparse@5.4.1';
    import {
      Wallet, CreditCard, Plus, Trash2, Target, Edit3, AlertTriangle, CheckCircle2,
      Megaphone, Calendar, X, Eye, RefreshCw, ChevronLeft, ChevronRight, Save,
      Info, Check, Download, Upload, PlusCircle, BarChart3, TrendingUp, TrendingDown, DollarSign,
      PieChart, Activity, ShieldCheck, Zap, History, FileText, Filter, Layers
    } from 'lucide-react';

    // CONFIGURAÇÃO DO SUPABASE
    const SUPABASE_URL = 'https://zvqjtkwaxxtyhfrxmmvk.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_MdSZpVGO7E3ezVOTVEdtFg_OCFdi_Zr';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const MONTHS = [
      'Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho',
      'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'
    ];

    const DEFAULT_CATEGORIES_MAP = {
      'Cartão de Crédito': ['Fatura', 'Anuidade', 'Parcela', 'Juros/Encargos'],
      'Comunicação': ['Internet', 'Telefone Fixo', 'Celular/Plano', 'TV por Assinatura'],
      'Crianças': ['Escola/Creche', 'Brinquedos', 'Vestuário Infantil', 'Atividades/Esportes', 'Pediatra/Saúde', 'Pensão'],
      'Cuidados Pessoais': ['Salão/Barbearia', 'Cosméticos/Perfumaria', 'Farmácia', 'Estética/Academia'],
      'Dia a Dia': ['Supermercado', 'Padaria', 'Feira/Hortifruti', 'Lanches', 'Conveniência'],
      'Educação': ['Cursos', 'Livros', 'Mensalidade', 'Material Escolar/Escritório'],
      'Emprestado': ['Empréstimo Concedido', 'Devolução de Empréstimo', 'Ajuste de Saldo'],
      'Infraestrutura': ['Aluguel', 'Condomínio', 'Luz (Energia)', 'Água', 'Gás', 'IPTU', 'Manutenção Doméstica'],
      'Lazer': ['Viagens', 'Streaming/Assinaturas', 'Restaurantes/Bares', 'Cinema/Shows', 'Hobbies'],
      'Presentes': ['Aniversário', 'Natal', 'Datas Especiais', 'Lembrancinhas'],
      'Trabalho': ['Salário', 'Bônus/PLR', 'Freelance/Serviços', 'Ferramentas/Softwares'],
      'Transferência': ['Entre Contas Próprias', 'Aporte Investimentos', 'Resgate Investimentos'],
      'Transporte': ['Combustível', 'Uber/App', 'Manutenção Veicular', 'Seguro Veicular', 'IPVA/Licenciamento', 'Pedágio/Estacionamento'],
      'Vestuário': ['Roupas', 'Calçados', 'Acessórios']
    };

    // Helper para avançar meses em datas no formato YYYY-MM-DD
    const addMonthsToDate = (dateStr, monthsToAdd) => {
      const parts = dateStr.split('-');
      if (parts.length < 3) return dateStr;
      let year = parseInt(parts[0], 10);
      let month = parseInt(parts[1], 10) + monthsToAdd;
      const day = parts[2];

      while (month > 12) {
        month -= 12;
        year += 1;
      }
      return `${year}-${String(month).padStart(2, '0')}-${day}`;
    };

    // Helper para calcular a fatura do cartão considerando a regra do dia 16:
    const getTransactionInvoicePeriod = (dateStr) => {
      if (!dateStr) return '';
      const parts = dateStr.split('-');
      if (parts.length < 2) return dateStr.substring(0, 7);
      let year = parseInt(parts[0], 10);
      let month = parseInt(parts[1], 10);
      const day = parseInt(parts[2], 10);

      if (day >= 16) {
        month += 1;
        if (month > 12) {
          month = 1;
          year += 1;
        }
      }
      return `${year}-${String(month).padStart(2, '0')}`;
    };

    function App() {
      const currentDate = new Date();
      const [selectedYear, setSelectedYear] = useState(currentDate.getFullYear());
      const [selectedMonth, setSelectedMonth] = useState(currentDate.getMonth() + 1);

      const [financeTab, setFinanceTab] = useState('painel');
      const [loading, setLoading] = useState(true);
      const [transactions, setTransactions] = useState([]);
      const [budgets, setBudgets] = useState({});
      const [cards, setCards] = useState([]);
      const [spreadsheetMode, setSpreadsheetMode] = useState(false);
      const [cardSpreadsheetMode, setCardSpreadsheetMode] = useState(false);
      const [showAllMonths, setShowAllMonths] = useState(false);
      const [selectedTxIds, setSelectedTxIds] = useState([]);
      const [searchTx, setSearchTx] = useState('');

      const [columnFilters, setColumnFilters] = useState({
        origem: '',
        classificacao: '',
        conta: '',
        operacao: '',
        individuo: ''
      });
      const [showColumnFilters, setShowColumnFilters] = useState(false);

      const [categoriesMap, setCategoriesMap] = useState(DEFAULT_CATEGORIES_MAP);
      const [accounts, setAccounts] = useState(['Conta Talyson', 'Conta Karla', 'Ambos', 'Outro']);
      const [customModal, setCustomModal] = useState({ isOpen: false, type: '', categoryTarget: '', name: '' });

      const [toast, setToast] = useState(null);
      const [confirmModal, setConfirmModal] = useState({ isOpen: false, title: '', message: '', onConfirm: null });

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 4000);
      };

      const handleOpenCustomModal = (type, categoryTarget = '') => {
        setCustomModal({ isOpen: true, type, categoryTarget, name: '' });
      };

      const handleAddCustomItemSubmit = (e) => {
        e.preventDefault();
        const name = customModal.name.trim();
        if (!name) return;

        if (customModal.type === 'origem') {
          if (!categoriesMap[name]) {
            setCategoriesMap(prev => ({ ...prev, [name]: ['Geral'] }));
            setNewTxForm(prev => ({ ...prev, origem: name, classificacao: 'Geral' }));
            showToast(`Nova categoria "${name}" adicionada!`);
          } else {
            showToast('Esta categoria já existe.', 'error');
          }
        } else if (customModal.type === 'classificacao') {
          const targetCat = customModal.categoryTarget || newTxForm.origem;
          if (categoriesMap[targetCat]) {
            if (!categoriesMap[targetCat].includes(name)) {
              setCategoriesMap(prev => ({
                ...prev,
                [targetCat]: [...prev[targetCat], name]
              }));
              setNewTxForm(prev => ({ ...prev, classificacao: name }));
              showToast(`Nova classificação "${name}" adicionada em "${targetCat}"!`);
            } else {
              showToast('Esta classificação já existe para esta categoria.', 'error');
            }
          }
        } else if (customModal.type === 'conta') {
          if (!accounts.includes(name)) {
            setAccounts(prev => [...prev, name]);
            setNewTxForm(prev => ({ ...prev, conta: name }));
            showToast(`Nova conta "${name}" cadastrada!`);
          } else {
            showToast('Esta conta já está cadastrada.', 'error');
          }
        }

        setCustomModal({ isOpen: false, type: '', categoryTarget: '', name: '' });
      };

      const selectedPeriodKey = useMemo(() => {
        const m = String(selectedMonth).padStart(2, '0');
        return `${selectedYear}-${m}`;
      }, [selectedYear, selectedMonth]);

      const [showAddTxModal, setShowAddTxModal] = useState(false);
      const [newTxForm, setNewTxForm] = useState({
        data: `${selectedPeriodKey}-01`,
        origem: 'Dia a Dia',
        classificacao: 'Supermercado',
        conta: 'Conta Talyson',
        operacao: 'Pix',
        cartaoId: '',
        entrada: '',
        saida: '',
        comentario: '',
        individuo: 'Ambos',
        isParcelado: false,
        totalParcelas: '2'
      });

      useEffect(() => {
        const today = new Date().toISOString().split('T')[0];
        if (today.startsWith(selectedPeriodKey)) {
          setNewTxForm(prev => ({ ...prev, data: today }));
        } else {
          setNewTxForm(prev => ({ ...prev, data: `${selectedPeriodKey}-01` }));
        }
      }, [selectedPeriodKey]);

      const [selectedCardForDetails, setSelectedCardForDetails] = useState(null);
      const [showAddCard, setShowAddCard] = useState(false);
      const [newCard, setNewCard] = useState({
        nome: '',
        titular: 'Talyson',
        limite: '',
        faturaAtual: '0',
        diaFechamento: '',
        diaVencimento: '',
        cor: 'from-indigo-600 to-purple-800'
      });

      const fetchDatabaseData = async () => {
        setLoading(true);
        try {
          const [cardsRes, budgetsRes, txRes] = await Promise.all([
            supabase.from('cards').select('*').order('id', { ascending: true }),
            supabase.from('budgets').select('*'),
            supabase.from('transactions').select('*').order('data', { ascending: false }).order('id', { ascending: false })
          ]);

          if (cardsRes.data) {
            const loadedCards = cardsRes.data.map(c => ({
              id: c.id,
              nome: c.nome,
              titular: c.titular,
              limite: Number(c.limite),
              faturaAtual: Number(c.fatura_atual),
              diaFechamento: c.dia_fechamento,
              diaVencimento: c.dia_vencimento,
              cor: c.cor
            }));
            setCards(loadedCards);
            if (loadedCards.length > 0 && !selectedCardForDetails) {
              setSelectedCardForDetails(loadedCards[0]);
            }
          }

          if (budgetsRes.data) {
            const bMap = {};
            budgetsRes.data.forEach(b => {
              if (b.periodo) {
                bMap[`${b.periodo}_${b.categoria}`] = Number(b.valor_planejado);
              } else {
                bMap[b.categoria] = Number(b.valor_planejado);
              }
            });
            setBudgets(bMap);
          }

          if (txRes.data) {
            const loadedTx = txRes.data.map(t => ({
              id: t.id,
              data: t.data,
              origem: t.origem,
              classificacao: t.classificacao,
              conta: t.conta,
              cartaoId: t.cartao_id,
              entrada: Number(t.entrada),
              saída: Number(t.saida),
              comentario: t.comentario,
              individuo: t.individuo,
              operacao: t.operacao
            }));

            const newCatMap = { ...categoriesMap };
            const newAccounts = new Set(accounts);

            loadedTx.forEach(t => {
              if (t.origem) {
                if (!newCatMap[t.origem]) {
                  newCatMap[t.origem] = [t.classificacao || 'Geral'];
                } else if (t.classificacao && !newCatMap[t.origem].includes(t.classificacao)) {
                  newCatMap[t.origem].push(t.classificacao);
                }
              }
              if (t.conta && !newAccounts.has(t.conta)) {
                newAccounts.add(t.conta);
              }
            });

            setCategoriesMap(newCatMap);
            setAccounts(Array.from(newAccounts));
            setTransactions(loadedTx);
          }
        } catch (err) {
          console.error("Erro ao carregar dados do Supabase:", err);
          showToast("Erro de conexão com o banco de dados.", "error");
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchDatabaseData();
      }, []);

      const monthlyTransactions = useMemo(() => {
        if (showAllMonths) return transactions;
        return transactions.filter(t => t.data && t.data.startsWith(selectedPeriodKey));
      }, [transactions, selectedPeriodKey, showAllMonths]);

      const getCategoryBudget = (category) => {
        const periodKey = `${selectedPeriodKey}_${category}`;
        if (budgets[periodKey] !== undefined) return budgets[periodKey];
        return budgets[category] || 0;
      };

      const handlePrevMonth = () => {
        if (selectedMonth === 1) {
          setSelectedMonth(12);
          setSelectedYear(prev => prev - 1);
        } else {
          setSelectedMonth(prev => prev - 1);
        }
      };

      const handleNextMonth = () => {
        if (selectedMonth === 12) {
          setSelectedMonth(1);
          setSelectedYear(prev => prev + 1);
        } else {
          setSelectedMonth(prev => prev + 1);
        }
      };

      const talysonBalance = useMemo(() => {
        return transactions
          .filter(t => t.conta === 'Conta Talyson')
          .reduce((acc, t) => {
            const entrada = Number(t.entrada) || 0;
            const saida = t.operacao === 'Crédito' ? 0 : (Number(t.saída) || 0);
            return acc + entrada - saida;
          }, 0.00);
      }, [transactions]);

      const karlaBalance = useMemo(() => {
        return transactions
          .filter(t => t.conta === 'Conta Karla')
          .reduce((acc, t) => {
            const entrada = Number(t.entrada) || 0;
            const saida = t.operacao === 'Crédito' ? 0 : (Number(t.saída) || 0);
            return acc + entrada - saida;
          }, 0.00);
      }, [transactions]);

      const consolidatedBalance = talysonBalance + karlaBalance;

      const getCardInvoice = (cardId, baseValue) => {
        const creditSum = transactions
          .filter(t => t.operacao === 'Crédito' && Number(t.cartaoId) === Number(cardId) && getTransactionInvoicePeriod(t.data) === selectedPeriodKey)
          .reduce((sum, t) => sum + (Number(t.saída) || 0), 0);
        return (Number(baseValue) || 0) + creditSum;
      };

      const getCardTransactionsForPeriod = (cardId) => {
        return transactions.filter(
          t => t.operacao === 'Crédito' && Number(t.cartaoId) === Number(cardId) && getTransactionInvoicePeriod(t.data) === selectedPeriodKey
        );
      };

      const totalFaturasCartoes = useMemo(() => {
        return cards.reduce((acc, c) => acc + getCardInvoice(c.id, c.faturaAtual), 0);
      }, [cards, transactions, selectedPeriodKey]);

      const expenseCategories = useMemo(() => Object.keys(categoriesMap).filter(cat => cat !== 'Trabalho'), [categoriesMap]);

      const totalExpensePlanned = useMemo(() => {
        return expenseCategories.reduce((sum, cat) => sum + getCategoryBudget(cat), 0);
      }, [budgets, expenseCategories, selectedPeriodKey]);

      const totalExpenseExecuted = useMemo(() => {
        return monthlyTransactions
          .filter(t => expenseCategories.includes(t.origem))
          .reduce((sum, t) => sum + (Number(t.saída) || 0), 0);
      }, [monthlyTransactions, expenseCategories]);

      const totalExpenseRemaining = totalExpensePlanned - totalExpenseExecuted;
      const globalExpensePercentage = totalExpensePlanned > 0 ? (totalExpenseExecuted / totalExpensePlanned) * 100 : 0;

      const monthlyIncome = useMemo(() => {
        return monthlyTransactions.reduce((sum, t) => sum + (Number(t.entrada) || 0), 0);
      }, [monthlyTransactions]);

      const monthlyExpensesTotal = useMemo(() => {
        return monthlyTransactions.reduce((sum, t) => sum + (Number(t.saída) || 0), 0);
      }, [monthlyTransactions]);

      const incomeExpenseRatio = monthlyIncome > 0 ? (monthlyExpensesTotal / monthlyIncome) * 100 : 0;

      const sortedExpensesList = useMemo(() => {
        return monthlyTransactions
          .filter(t => (Number(t.saída) || 0) > 0)
          .sort((a, b) => (Number(b.saída) || 0) - (Number(a.saída) || 0));
      }, [monthlyTransactions]);

      const historicalComparison = useMemo(() => {
        const map = {};
        transactions.forEach(t => {
          if (!t.data) return;
          const period = t.data.substring(0, 7);
          if (!map[period]) {
            map[period] = { period, income: 0, expense: 0 };
          }
          map[period].income += Number(t.entrada) || 0;
          map[period].expense += Number(t.saída) || 0;
        });
        return Object.values(map).sort((a, b) => b.period.localeCompare(a.period));
      }, [transactions]);

      const categoryChartRef = useRef(null);
      const trendChartRef = useRef(null);
      const categoryChartInstance = useRef(null);
      const trendChartInstance = useRef(null);

      useEffect(() => {
        if (financeTab === 'dashboard') {
          if (categoryChartRef.current) {
            if (categoryChartInstance.current) {
              categoryChartInstance.current.destroy();
            }

            const catTotals = {};
            expenseCategories.forEach(cat => {
              const sum = monthlyTransactions
                .filter(t => t.origem === cat)
                .reduce((acc, t) => acc + (Number(t.saída) || 0), 0);
              if (sum > 0) catTotals[cat] = sum;
            });

            const sortedCats = Object.entries(catTotals).sort((a, b) => b[1] - a[1]);
            const labels = sortedCats.map(item => item[0]);
            const dataValues = sortedCats.map(item => item[1]);

            const ctx = categoryChartRef.current.getContext('2d');
            categoryChartInstance.current = new Chart(ctx, {
              type: 'bar',
              data: {
                labels: labels.length > 0 ? labels : ['Sem dados'],
                datasets: [{
                  label: 'Gastos por Categoria (R$)',
                  data: dataValues.length > 0 ? dataValues : [0],
                  backgroundColor: 'rgba(99, 102, 241, 0.7)',
                  borderColor: 'rgba(99, 102, 241, 1)',
                  borderWidth: 1,
                  borderRadius: 6,
                }]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                  legend: { display: false }
                },
                scales: {
                  y: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#94a3b8' } },
                  x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
                }
              }
            });
          }

          if (trendChartRef.current) {
            if (trendChartInstance.current) {
              trendChartInstance.current.destroy();
            }

            const recentHist = [...historicalComparison].reverse().slice(-6);
            const trendLabels = recentHist.map(h => h.period);
            const trendIncome = recentHist.map(h => h.income);
            const trendExpense = recentHist.map(h => h.expense);

            const ctx2 = trendChartRef.current.getContext('2d');
            trendChartInstance.current = new Chart(ctx2, {
              type: 'line',
              data: {
                labels: trendLabels.length > 0 ? trendLabels : [selectedPeriodKey],
                datasets: [
                  {
                    label: 'Receitas (R$)',
                    data: trendIncome.length > 0 ? trendIncome : [0],
                    borderColor: '#10b981',
                    backgroundColor: 'rgba(16, 185, 129, 0.1)',
                    fill: true,
                    tension: 0.3
                  },
                  {
                    label: 'Despesas (R$)',
                    data: trendExpense.length > 0 ? trendExpense : [0],
                    borderColor: '#f43f5e',
                    backgroundColor: 'rgba(244, 63, 94, 0.1)',
                    fill: true,
                    tension: 0.3
                  }
                ]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                  legend: { labels: { color: '#cbd5e1' } }
                },
                scales: {
                  y: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#94a3b8' } },
                  x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
                }
              }
            });
          }
        }

        return () => {
          if (categoryChartInstance.current) categoryChartInstance.current.destroy();
          if (trendChartInstance.current) trendChartInstance.current.destroy();
        };
      }, [financeTab, monthlyTransactions, historicalComparison, selectedPeriodKey]);

      const financialHealthScore = useMemo(() => {
        let score = 70;
        if (monthlyIncome > 0) {
          const ratio = monthlyExpensesTotal / monthlyIncome;
          if (ratio <= 0.5) score += 25;
          else if (ratio <= 0.75) score += 15;
          else if (ratio <= 1.0) score += 5;
          else score -= 30;
        }
        if (totalExpensePlanned > 0 && totalExpenseExecuted <= totalExpensePlanned) {
          score += 15;
        } else {
          score -= 10;
        }
        if (consolidatedBalance > 0) score += 10;
        else score -= 15;
        return Math.max(0, Math.min(100, score));
      }, [monthlyIncome, monthlyExpensesTotal, totalExpensePlanned, totalExpenseExecuted, consolidatedBalance]);

      const tickerItems = useMemo(() => {
        const items = [
          { icon: '📅', label: 'Período', value: `${MONTHS[selectedMonth - 1]} / ${selectedYear}`, colorClass: 'text-indigo-300' },
          { icon: '🎯', label: 'Meta Mensal', value: `R$ ${totalExpensePlanned.toFixed(2)}`, colorClass: 'text-indigo-400' },
          { icon: '💸', label: 'Executado no Mês', value: `R$ ${totalExpenseExecuted.toFixed(2)} (${globalExpensePercentage.toFixed(1)}%)`, colorClass: 'text-amber-400' },
          { icon: '💳', label: 'Faturas do Mês', value: `R$ ${totalFaturasCartoes.toFixed(2)}`, colorClass: 'text-purple-400' },
          { icon: '💰', label: 'Saldo Restante', value: `R$ ${totalExpenseRemaining.toFixed(2)}`, colorClass: totalExpenseRemaining >= 0 ? 'text-emerald-400' : 'text-rose-400' },
        ];

        expenseCategories.forEach(cat => {
          const planned = getCategoryBudget(cat);
          if (planned <= 0) return;
          const executed = monthlyTransactions.filter(t => t.origem === cat).reduce((sum, t) => sum + (Number(t.saída) || 0), 0);
          const pct = (executed / planned) * 100;

          if (pct >= 100) {
            items.push({ icon: '🚨', label: `ALERTA: ${cat}`, value: `Excedido! (${pct.toFixed(0)}%) - R$ ${executed.toFixed(2)} / R$ ${planned.toFixed(2)}`, colorClass: 'text-rose-400 font-bold' });
          } else if (pct >= 75) {
            items.push({ icon: '⚠️', label: `Atenção: ${cat}`, value: `Atingiu ${pct.toFixed(0)}% da meta`, colorClass: 'text-amber-300 font-semibold' });
          }
        });

        return items;
      }, [selectedMonth, selectedYear, expenseCategories, budgets, monthlyTransactions, totalExpensePlanned, totalExpenseExecuted, totalExpenseRemaining, globalExpensePercentage, totalFaturasCartoes, selectedPeriodKey]);

      const uniqueOrigins = useMemo(() => {
        const s = new Set(monthlyTransactions.map(t => t.origem).filter(Boolean));
        return Array.from(s).sort();
      }, [monthlyTransactions]);

      const uniqueClassifications = useMemo(() => {
        const s = new Set(monthlyTransactions.map(t => t.classificacao).filter(Boolean));
        return Array.from(s).sort();
      }, [monthlyTransactions]);

      const uniqueAccounts = useMemo(() => {
        const s = new Set(monthlyTransactions.map(t => t.conta).filter(Boolean));
        return Array.from(s).sort();
      }, [monthlyTransactions]);

      const uniqueOperations = useMemo(() => {
        const s = new Set(monthlyTransactions.map(t => t.operacao).filter(Boolean));
        return Array.from(s).sort();
      }, [monthlyTransactions]);

      const uniqueIndividuals = useMemo(() => {

      const filteredTransactions = useMemo(() => {
        return [...monthlyTransactions]
          .sort((a, b) => new Date(b.data).getTime() - new Date(a.data).getTime() || b.id - a.id)
          .filter(t => {
            const matchesSearch = 
              (t.comentario || '').toLowerCase().includes(searchTx.toLowerCase()) || 
              (t.origem || '').toLowerCase().includes(searchTx.toLowerCase()) ||
              (t.classificacao || '').toLowerCase().includes(searchTx.toLowerCase());

            const matchesOrigem = !columnFilters.origem || t.origem === columnFilters.origem;
            const matchesClassificacao = !columnFilters.classificacao || t.classificacao === columnFilters.classificacao;
            const matchesConta = !columnFilters.conta || t.conta === columnFilters.conta;
            const matchesOperacao = !columnFilters.operacao || t.operacao === columnFilters.operacao;
            const matchesIndividuo = !columnFilters.individuo || t.individuo === columnFilters.individuo;

            return matchesSearch && matchesOrigem && matchesClassificacao && matchesConta && matchesOperacao && matchesIndividuo;
          });

      const handleCreateTransactionSubmit = async (e) => {

      const handleExportCSV = () => {
        const csvData = filteredTransactions.map(t => ({
          Data: t.data,
          Origem: t.origem,
          Classificação: t.classificacao,
          Conta: t.conta,
          Operação: t.operacao,
          'Cartão (ID)': t.cartaoId || '',
          Entrada: t.entrada,
          Saída: t.saída,
          Comentário: t.comentario,
          Indivíduo: t.individuo
        }));

        const csv = Papa.unparse(csvData);
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.setAttribute('download', `financas_${selectedPeriodKey}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const handleImportCSV = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        Papa.parse(file, {
          header: true,
          skipEmptyLines: true,
          complete: async (results) => {
            const rows = results.data;

            const parseCurrency = (val) => {
              if (!val) return 0;
              let s = String(val).trim().replace('R$', '').replace(/\s/g, '');
              if (!s) return 0;
              if (s.includes(',')) {
                s = s.replace(/\./g, '').replace(',', '.');
              }
              const num = parseFloat(s);
              return isNaN(num) ? 0 : num;
            };

            const parseDate = (val) => {
              if (!val) return `${selectedPeriodKey}-01`;
              let str = String(val).trim();
              if (str.includes(' ')) str = str.split(' ')[0];
              if (str.includes('T')) str = str.split('T')[0];

              if (str.includes('/')) {
                const parts = str.split('/');
                if (parts.length === 3) {
                  const d = parts[0].padStart(2, '0');
                  const m = parts[1].padStart(2, '0');
                  const y = parts[2].length === 2 ? `20${parts[2]}` : parts[2];
                  return `${y}-${m}-${d}`;
                }
              }
              if (/^\d{4}-\d{2}-\d{2}$/.test(str)) return str;
              return `${selectedPeriodKey}-01`;
            };

            const getColVal = (row, possibleKeys) => {
              const rowKeys = Object.keys(row);
              for (const pk of possibleKeys) {
                const matchedKey = rowKeys.find(k => k.trim().toUpperCase() === pk.toUpperCase() || k.trim().toUpperCase().startsWith(pk.toUpperCase()));
                if (matchedKey && row[matchedKey] !== undefined) {
                  return String(row[matchedKey]).trim();
                }
              }
              return '';
            };

            const payloads = rows.map(row => {
              const rawData = getColVal(row, ['DATA']);
              const rawOrigem = getColVal(row, ['ORIGEM/D', 'ORIGEM', 'CATEGORIA', 'DESCRICAO', 'DESCRIÇÃO']);
              const rawConta = getColVal(row, ['CONTA']);
              const rawClassific = getColVal(row, ['CLASSIFIC.', 'CLASSIFIC', 'CLASSIFICAÇÃO', 'CLASSIFICACAO']);
              const rawEntrada = getColVal(row, ['ENTRADA']);
              const rawSaida = getColVal(row, ['SAIDA', 'SAÍDA', 'VALOR']);
              const rawComenta = getColVal(row, ['COMENTA', 'COMENTÁRIO', 'COMENTARIO', 'OBSERVAÇÃO']);
              const rawIndividuo = getColVal(row, ['INDIVIDUO', 'INDIVÍDUO']);
              const rawOp = getColVal(row, ['OP', 'OPERAÇÃO', 'OPERACAO']);

              let conta = 'Conta Talyson';
              const contaUpper = rawConta.toUpperCase();
              if (contaUpper.includes('TALYSON')) conta = 'Conta Talyson';
              else if (contaUpper.includes('KARLA')) conta = 'Conta Karla';
              else if (contaUpper) conta = rawConta;

              let operacao = 'Pix';
              const opUpper = rawOp.toUpperCase();
              if (opUpper === 'DEB' || opUpper.includes('DÉBITO') || opUpper.includes('DEBITO')) operacao = 'Débito';
              else if (opUpper === 'PIX') operacao = 'Pix';
              else if (opUpper === 'CRED' || opUpper.includes('CRÉDITO') || opUpper.includes('CREDITO')) operacao = 'Crédito';
              else if (opUpper === 'TRANS' || opUpper.includes('TRANSFERÊNCIA') || opUpper.includes('TRANSFERENCIA')) operacao = 'Transferência';
              else if (opUpper.includes('DINHEIRO')) operacao = 'Dinheiro';

              let individuo = 'Ambos';
              const indUpper = rawIndividuo.toUpperCase();
              if (indUpper.includes('TALYSON')) individuo = 'Talyson';
              else if (indUpper.includes('KARLA')) individuo = 'Karla';
              else if (indUpper) individuo = rawIndividuo;

              let origem = rawOrigem || 'Dia a Dia';
              const matchedOrigem = Object.keys(DEFAULT_CATEGORIES_MAP).find(c => c.toUpperCase() === origem.toUpperCase());
              if (matchedOrigem) origem = matchedOrigem;

              let classificacao = rawClassific || (DEFAULT_CATEGORIES_MAP[origem] ? DEFAULT_CATEGORIES_MAP[origem][0] : 'Geral');

              return {
                data: parseDate(rawData),
                origem: origem,
                classificacao: classificacao,
                conta: conta,
                operacao: operacao,
                cartao_id: null,
                entrada: parseCurrency(rawEntrada),
                saida: parseCurrency(rawSaida),
                comentario: rawComenta || 'Importado via CSV',
                individuo: individuo
              };
            });

            if(payloads.length === 0) {
               showToast('Arquivo CSV vazio ou em formato inválido.', 'error');
               return;
            }

            const { data, error } = await supabase.from('transactions').insert(payloads).select();
            
            if (!error && data) {
              const newRows = data.map(d => ({
                id: d.id,
                data: d.data,
                origem: d.origem,
                classificacao: d.classificacao,
                conta: d.conta,
                cartaoId: d.cartao_id,
                entrada: Number(d.entrada),
                saída: Number(d.saida),
                comentario: d.comentario,
                individuo: d.individuo,
                operacao: d.operacao
              }));
              
              setTransactions(prev => [...newRows, ...prev]);
              showToast(`${newRows.length} linhas importadas com sucesso!`);
            } else {
              showToast('Erro ao importar dados no banco.', 'error');
              console.error(error);
            }
            e.target.value = '';
          }
        });
      };

      const handleAddCardSubmit = async (e) => {

        const payload = {

      return (
        <div className="flex-1 flex flex-col h-full relative">

                <Wallet className="w-6 h-6 text-slate-950 font-bold" />
              </div>
              <div>
                <h1 className="text-lg font-bold text-white flex items-center gap-2">
                  Sistema de Finanças Pessoais
                  <span className="text-[10px] uppercase font-semibold px-2 py-0.5 rounded-full bg-slate-800 text-indigo-400 border border-slate-700">Supabase DB</span>

              </div>

              <button

                      <input 
                        type="number" 
                        step="0.01" 
                        value={newTxForm.saida} 
                        onChange={e => setNewTxForm({...newTxForm, saida: e.target.value})}
                        placeholder="0.00"
                        className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-rose-400 focus:border-indigo-500 focus:outline-none" 
                      />
                    </div>
                  </div>

                  <div>
                    <label className="text-xs text-slate-400 font-semibold block mb-1">Comentário / Observação</label>
                    <input 
                      type="text" 
                      value={newTxForm.comentario} 
                      onChange={e => setNewTxForm({...newTxForm, comentario: e.target.value})}
                      placeholder="Ex: Supermercado mensal..."
                      className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:border-indigo-500 focus:outline-none" 
                    />
                  </div>

                  <div className="flex justify-end gap-3 pt-4 border-t border-slate-800">
                    <button type="button" onClick={() => setShowAddTxModal(false)} className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-lg text-slate-300">
                      Cancelar
                    </button>
                    <button type="submit" className="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-xs font-semibold rounded-lg text-white shadow-lg shadow-indigo-600/30">
                      Salvar Lançamento
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL ADICIONAR CARTÃO */}
          {showAddCard && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-purple-500/30 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-6">
                <div className="flex justify-between items-center border-b border-slate-800 pb-4">
                  <h3 className="text-lg font-bold text-white flex items-center gap-2">
                    <CreditCard className="w-5 h-5 text-purple-400" /> Novo Cartão de Crédito
                  </h3>
                  <button onClick={() => setShowAddCard(false)} className="text-slate-400 hover:text-white"><X className="w-5 h-5" /></button>
                </div>

                <form onSubmit={handleAddCardSubmit} className="space-y-4">
                  <div>
                    <label className="text-xs text-slate-400 font-semibold block mb-1">Nome do Cartão</label>
                    <input type="text" required value={newCard.nome} onChange={e => setNewCard({...newCard, nome: e.target.value})} placeholder="Ex: Nubank, Visa Infinite..." className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-purple-500" />
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="text-xs text-slate-400 font-semibold block mb-1">Titular</label>
                      <select value={newCard.titular} onChange={e => setNewCard({...newCard, titular: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-purple-500">
                        <option value="Talyson">Talyson</option>
                        <option value="Karla">Karla</option>
                      </select>
                    </div>
                    <div>
                      <label className="text-xs text-slate-400 font-semibold block mb-1">Limite Total (R$)</label>
                      <input type="number" step="100" required value={newCard.limite} onChange={e => setNewCard({...newCard, limite: e.target.value})} placeholder="5000.00" className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-purple-500" />
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-2">
                    <div>
                      <label className="text-xs text-slate-400 font-semibold block mb-1">Dia Fechamento</label>
                      <input type="number" min="1" max="31" required value={newCard.diaFechamento} onChange={e => setNewCard({...newCard, diaFechamento: e.target.value})} placeholder="16" className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-purple-500" />
                    </div>
                    <div>
                      <label className="text-xs text-slate-400 font-semibold block mb-1">Dia Vencimento</label>
                      <input type="number" min="1" max="31" required value={newCard.diaVencimento} onChange={e => setNewCard({...newCard, diaVencimento: e.target.value})} placeholder="25" className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-purple-500" />
                    </div>
                    <div>
                      <label className="text-xs text-slate-400 font-semibold block mb-1">Fatura Atual (R$)</label>
                      <input type="number" step="0.01" value={newCard.faturaAtual} onChange={e => setNewCard({...newCard, faturaAtual: e.target.value})} placeholder="0.00" className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-purple-500" />
                    </div>
                  </div>

                  <div>
                    <label className="text-xs text-slate-400 font-semibold block mb-1">Estilo Visual do Cartão</label>
                    <select value={newCard.cor} onChange={e => setNewCard({...newCard, cor: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-purple-500">
                      {[
                        { label: 'Roxo / Índigo', value: 'from-indigo-600 to-purple-800' },
                        { label: 'Rosa / Violeta', value: 'from-purple-600 to-pink-700' },
                        { label: 'Verde / Esmeralda', value: 'from-emerald-600 to-teal-800' },
                        { label: 'Azul / Ciano', value: 'from-blue-600 to-cyan-800' },
                        { label: 'Laranja / Amarelo', value: 'from-amber-600 to-orange-800' },
                        { label: 'Cinza / Escuro', value: 'from-slate-700 to-slate-900' },
                        { label: 'Vermelho / Rubi', value: 'from-rose-600 to-red-900' }
                      ].map(g => <option key={g.value} value={g.value}>{g.label}</option>)}
                    </select>
                  </div>

                  <div className="flex justify-end gap-3 pt-4 border-t border-slate-800">
                    <button type="button" onClick={() => setShowAddCard(false)} className="px-4 py-2 bg-slate-800 text-xs font-semibold rounded-lg text-slate-300">Cancelar</button>
                    <button type="submit" className="px-5 py-2 bg-purple-600 hover:bg-purple-500 text-xs font-semibold rounded-lg text-white">Cadastrar Cartão</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL ADICIONAR ITEM PERSONALIZADO */}
          {customModal.isOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-indigo-500/30 rounded-2xl max-w-sm w-full p-6 shadow-2xl space-y-4">
                <h3 className="text-base font-bold text-white capitalize">
                  Adicionar Novo {customModal.type === 'origem' ? 'Categoria' : customModal.type === 'classificacao' ? 'Classificação' : 'Conta'}
                </h3>
                <form onSubmit={handleAddCustomItemSubmit} className="space-y-4">
                  <input
                    type="text"
                    required
                    autoFocus
                    placeholder="Nome..."
                    value={customModal.name}
                    onChange={e => setCustomModal(prev => ({ ...prev, name: e.target.value }))}
                    className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:border-indigo-500 focus:outline-none"
                  />
                  <div className="flex justify-end gap-2">
                    <button type="button" onClick={() => setCustomModal({ isOpen: false, type: '', categoryTarget: '', name: '' })} className="px-3 py-1.5 bg-slate-800 text-xs rounded-lg text-slate-300">Cancelar</button>
                    <button type="submit" className="px-4 py-1.5 bg-indigo-600 text-xs rounded-lg text-white font-semibold">Adicionar</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL DE CONFIRMAÇÃO */}
          {confirmModal.isOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-rose-500/30 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <div className="flex items-center gap-3 text-rose-400">
                  <AlertTriangle className="w-6 h-6 shrink-0" />
                  <h3 className="text-base font-bold text-white">{confirmModal.title}</h3>
                </div>
                <p className="text-xs text-slate-300">{confirmModal.message}</p>
                <div className="flex justify-end gap-3 pt-2">
                  <button onClick={() => setConfirmModal({ isOpen: false })} className="px-4 py-2 bg-slate-800 text-xs font-semibold rounded-lg text-slate-300">Cancelar</button>
                  <button onClick={confirmModal.onConfirm} className="px-4 py-2 bg-rose-600 hover:bg-rose-500 text-xs font-semibold rounded-lg text-white">Confirmar Exclusão</button>
                </div>
              </div>
            </div>
          )}

          {/* TOAST DE NOTIFICAÇÃO */}
          {toast && (
            <div className={`fixed bottom-6 right-6 z-50 px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 border text-xs font-semibold animate-bounce ${
              toast.type === 'error' ? 'bg-rose-950/90 border-rose-500/50 text-rose-200' : 'bg-emerald-950/90 border-emerald-500/50 text-emerald-200'
            }`}>
              {toast.type === 'error' ? <AlertTriangle className="w-4 h-4 text-rose-400" /> : <CheckCircle2 className="w-4 h-4 text-emerald-400" />}
              {toast.message}
            </div>
          )}
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
