<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Finanças Pessoais (Supabase)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.344.0?external=react",
        "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
      }
    }
  </script>
  <style>
    @keyframes marquee {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-50%); }

    .animate-marquee {
      display: flex;
      width: max-content;
      animation: marquee 70s linear infinite;
    }
    .animate-marquee:hover {
      animation-play-state: paused;
    }
    
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a; 
    }
    ::-webkit-scrollbar-thumb {
      background: #334155; 
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569; 
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans selection:bg-indigo-500 selection:text-white overflow-hidden">
  <div id="root" class="h-screen w-screen flex flex-col"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useMemo } from 'react';
    import { createRoot } from 'react-dom/client';
    import { createClient } from '@supabase/supabase-js';
    import Papa from 'https://esm.sh/papaparse@5.4.1';
    import {
      Wallet, CreditCard, Plus, Trash2, Target, Edit3, AlertTriangle, CheckCircle2,
      Megaphone, Calendar, X, Eye, RefreshCw, ChevronLeft, ChevronRight, Save,
      Info, Check, Download, Upload, PlusCircle
    } from 'lucide-react';

    // CONFIGURAÇÃO DO SUPABASE
    const SUPABASE_URL = 'https://zvqjtkwaxxtyhfrxmmvk.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_MdSZpVGO7E3ezVOTVEdtFg_OCFdi_Zr';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const MONTHS = [
      'Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho',
      'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'
    ];

    const DEFAULT_CATEGORIES_MAP = {
      'Cartão de Crédito': ['Fatura', 'Anuidade', 'Parcela', 'Juros/Encargos'],
      'Comunicação': ['Internet', 'Telefone Fixo', 'Celular/Plano', 'TV por Assinatura'],
      'Crianças': ['Escola/Creche', 'Brinquedos', 'Vestuário Infantil', 'Atividades/Esportes', 'Pediatra/Saúde', 'Pensão'],
      'Cuidados Pessoais': ['Salão/Barbearia', 'Cosméticos/Perfumaria', 'Farmácia', 'Estética/Academia'],
      'Dia a Dia': ['Supermercado', 'Padaria', 'Feira/Hortifruti', 'Lanches', 'Conveniência'],
      'Educação': ['Cursos', 'Livros', 'Mensalidade', 'Material Escolar/Escritório'],
      'Emprestado': ['Empréstimo Concedido', 'Devolução de Empréstimo', 'Ajuste de Saldo'],
      'Infraestrutura': ['Aluguel', 'Condomínio', 'Luz (Energia)', 'Água', 'Gás', 'IPTU', 'Manutenção Doméstica'],
      'Lazer': ['Viagens', 'Streaming/Assinaturas', 'Restaurantes/Bares', 'Cinema/Shows', 'Hobbies'],
      'Presentes': ['Aniversário', 'Natal', 'Datas Especiais', 'Lembrancinhas'],
      'Trabalho': ['Salário', 'Bônus/PLR', 'Freelance/Serviços', 'Ferramentas/Softwares'],
      'Transferência': ['Entre Contas Próprias', 'Aporte Investimentos', 'Resgate Investimentos'],
      'Transporte': ['Combustível', 'Uber/App', 'Manutenção Veicular', 'Seguro Veicular', 'IPVA/Licenciamento', 'Pedágio/Estacionamento'],
      'Vestuário': ['Roupas', 'Calçados', 'Acessórios']
    };

    const GRADIENTS = [
      { label: 'Roxo / Índigo', value: 'from-indigo-600 to-purple-800' },
      { label: 'Rosa / Violeta', value: 'from-purple-600 to-pink-700' },
      { label: 'Verde / Esmeralda', value: 'from-emerald-600 to-teal-800' },
      { label: 'Azul / Ciano', value: 'from-blue-600 to-cyan-800' },
      { label: 'Laranja / Amarelo', value: 'from-amber-600 to-orange-800' },
      { label: 'Cinza / Escuro', value: 'from-slate-700 to-slate-900' },
      { label: 'Vermelho / Rubi', value: 'from-rose-600 to-red-900' }
    ];

    function App() {
      const currentDate = new Date();
      const [selectedYear, setSelectedYear] = useState(currentDate.getFullYear());
      const [selectedMonth, setSelectedMonth] = useState(currentDate.getMonth() + 1);

      const [financeTab, setFinanceTab] = useState('painel');
      const [loading, setLoading] = useState(true);
      const [transactions, setTransactions] = useState([]);
      const [budgets, setBudgets] = useState({});
      const [cards, setCards] = useState([]);
      const [spreadsheetMode, setSpreadsheetMode] = useState(false);
      const [showAllMonths, setShowAllMonths] = useState(false);
      const [selectedTxIds, setSelectedTxIds] = useState([]);
      const [searchTx, setSearchTx] = useState('');

      const [categoriesMap, setCategoriesMap] = useState(DEFAULT_CATEGORIES_MAP);
      const [accounts, setAccounts] = useState(['Conta Talyson', 'Conta Karla', 'Ambos', 'Outro']);
      const [customModal, setCustomModal] = useState({ isOpen: false, type: '', categoryTarget: '', name: '' });

      const [toast, setToast] = useState(null);
      const [confirmModal, setConfirmModal] = useState({ isOpen: false, title: '', message: '', onConfirm: null });

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 4000);
      };

      const handleOpenCustomModal = (type, categoryTarget = '') => {
        setCustomModal({ isOpen: true, type, categoryTarget, name: '' });
      };

      const handleAddCustomItemSubmit = (e) => {
        e.preventDefault();
        const name = customModal.name.trim();
        if (!name) return;

        if (customModal.type === 'origem') {
          if (!categoriesMap[name]) {
            setCategoriesMap(prev => ({ ...prev, [name]: ['Geral'] }));
            setNewTxForm(prev => ({ ...prev, origem: name, classificacao: 'Geral' }));
            showToast(`Nova categoria "${name}" adicionada!`);
          } else {
            showToast('Esta categoria já existe.', 'error');
          }
        } else if (customModal.type === 'classificacao') {
          const targetCat = customModal.categoryTarget || newTxForm.origem;
          if (categoriesMap[targetCat]) {
            if (!categoriesMap[targetCat].includes(name)) {
              setCategoriesMap(prev => ({
                ...prev,
                [targetCat]: [...prev[targetCat], name]
              }));
              setNewTxForm(prev => ({ ...prev, classificacao: name }));
              showToast(`Nova classificação "${name}" adicionada em "${targetCat}"!`);
            } else {
              showToast('Esta classificação já existe para esta categoria.', 'error');
            }
          }
        } else if (customModal.type === 'conta') {
          if (!accounts.includes(name)) {
            setAccounts(prev => [...prev, name]);
            setNewTxForm(prev => ({ ...prev, conta: name }));
            showToast(`Nova conta "${name}" cadastrada!`);
          } else {
            showToast('Esta conta já está cadastrada.', 'error');
          }
        }

        setCustomModal({ isOpen: false, type: '', categoryTarget: '', name: '' });
      };

      const selectedPeriodKey = useMemo(() => {
        const m = String(selectedMonth).padStart(2, '0');
        return `${selectedYear}-${m}`;
      }, [selectedYear, selectedMonth]);

      const [showAddTxModal, setShowAddTxModal] = useState(false);
      const [newTxForm, setNewTxForm] = useState({
        data: `${selectedPeriodKey}-01`,
        origem: 'Dia a Dia',
        classificacao: 'Supermercado',
        conta: 'Conta Talyson',
        operacao: 'Pix',
        cartaoId: '',
        entrada: '',
        saida: '',
        comentario: '',
        individuo: 'Ambos'
      });

      useEffect(() => {
        const today = new Date().toISOString().split('T')[0];
        if (today.startsWith(selectedPeriodKey)) {
          setNewTxForm(prev => ({ ...prev, data: today }));
        } else {
          setNewTxForm(prev => ({ ...prev, data: `${selectedPeriodKey}-01` }));
        }
      }, [selectedPeriodKey]);

      const [selectedCardForDetails, setSelectedCardForDetails] = useState(null);
      const [showAddCard, setShowAddCard] = useState(false);
      const [newCard, setNewCard] = useState({
        nome: '',
        titular: 'Talyson',
        limite: '',
        faturaAtual: '0',
        diaFechamento: '',
        diaVencimento: '',
        cor: 'from-indigo-600 to-purple-800'
      });

      const fetchDatabaseData = async () => {
        setLoading(true);
        try {
          const [cardsRes, budgetsRes, txRes] = await Promise.all([
            supabase.from('cards').select('*').order('id', { ascending: true }),
            supabase.from('budgets').select('*'),
            supabase.from('transactions').select('*').order('data', { ascending: false }).order('id', { ascending: false })
          ]);

          if (cardsRes.data) {
            setCards(cardsRes.data.map(c => ({
              id: c.id,
              nome: c.nome,
              titular: c.titular,
              limite: Number(c.limite),
              faturaAtual: Number(c.fatura_atual),
              diaFechamento: c.dia_fechamento,
              diaVencimento: c.dia_vencimento,
              cor: c.cor
            })));
          }

          if (budgetsRes.data) {
            const bMap = {};
            budgetsRes.data.forEach(b => {
              if (b.periodo) {
                bMap[`${b.periodo}_${b.categoria}`] = Number(b.valor_planejado);
              } else {
                bMap[b.categoria] = Number(b.valor_planejado);
              }
            });
            setBudgets(bMap);
          }

          if (txRes.data) {
            const loadedTx = txRes.data.map(t => ({
              id: t.id,
              data: t.data,
              origem: t.origem,
              classificacao: t.classificacao,
              conta: t.conta,
              cartaoId: t.cartao_id,
              entrada: Number(t.entrada),
              saída: Number(t.saida),
              comentario: t.comentario,
              individuo: t.individuo,
              operacao: t.operacao
            }));

            const newCatMap = { ...categoriesMap };
            const newAccounts = new Set(accounts);

            loadedTx.forEach(t => {
              if (t.origem) {
                if (!newCatMap[t.origem]) {
                  newCatMap[t.origem] = [t.classificacao || 'Geral'];
                } else if (t.classificacao && !newCatMap[t.origem].includes(t.classificacao)) {
                  newCatMap[t.origem].push(t.classificacao);
                }
              }
              if (t.conta && !newAccounts.has(t.conta)) {
                newAccounts.add(t.conta);
              }
            });

            setCategoriesMap(newCatMap);
            setAccounts(Array.from(newAccounts));
            setTransactions(loadedTx);
          }
        } catch (err) {
          console.error("Erro ao carregar dados do Supabase:", err);
          showToast("Erro de conexão com o banco de dados.", "error");
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchDatabaseData();
      }, []);

      const monthlyTransactions = useMemo(() => {
        if (showAllMonths) return transactions;
        return transactions.filter(t => t.data && t.data.startsWith(selectedPeriodKey));
      }, [transactions, selectedPeriodKey, showAllMonths]);

      const getCategoryBudget = (category) => {
        const periodKey = `${selectedPeriodKey}_${category}`;
        if (budgets[periodKey] !== undefined) return budgets[periodKey];
        return budgets[category] || 0;
      };

      const handlePrevMonth = () => {
        if (selectedMonth === 1) {
          setSelectedMonth(12);
          setSelectedYear(prev => prev - 1);
        } else {
          setSelectedMonth(prev => prev - 1);
        }
      };

      const handleNextMonth = () => {
        if (selectedMonth === 12) {
          setSelectedMonth(1);
          setSelectedYear(prev => prev + 1);
        } else {
          setSelectedMonth(prev => prev + 1);
        }
      };

      const talysonBalance = useMemo(() => {
        return transactions
          .filter(t => t.conta === 'Conta Talyson')
          .reduce((acc, t) => {
            const entrada = Number(t.entrada) || 0;
            const saida = t.operacao === 'Crédito' ? 0 : (Number(t.saída) || 0);
            return acc + entrada - saida;
          }, 0.00);
      }, [transactions]);

      const karlaBalance = useMemo(() => {
        return transactions
          .filter(t => t.conta === 'Conta Karla')
          .reduce((acc, t) => {
            const entrada = Number(t.entrada) || 0;
            const saida = t.operacao === 'Crédito' ? 0 : (Number(t.saída) || 0);
            return acc + entrada - saida;
          }, 0.00);
      }, [transactions]);

      const consolidatedBalance = talysonBalance + karlaBalance;

      const getCardInvoice = (cardId, baseValue) => {
        const creditSum = monthlyTransactions
          .filter(t => t.operacao === 'Crédito' && Number(t.cartaoId) === Number(cardId))
          .reduce((sum, t) => sum + (Number(t.saída) || 0), 0);
        return (Number(baseValue) || 0) + creditSum;
      };

      const totalFaturasCartoes = useMemo(() => {
        return cards.reduce((acc, c) => acc + getCardInvoice(c.id, c.faturaAtual), 0);
      }, [cards, monthlyTransactions]);

      const expenseCategories = useMemo(() => Object.keys(categoriesMap).filter(cat => cat !== 'Trabalho'), [categoriesMap]);

      const totalExpensePlanned = useMemo(() => {
        return expenseCategories.reduce((sum, cat) => sum + getCategoryBudget(cat), 0);
      }, [budgets, expenseCategories, selectedPeriodKey]);

      const totalExpenseExecuted = useMemo(() => {
        return monthlyTransactions
          .filter(t => expenseCategories.includes(t.origem))
          .reduce((sum, t) => sum + (Number(t.saída) || 0), 0);
      }, [monthlyTransactions, expenseCategories]);

      const totalExpenseRemaining = totalExpensePlanned - totalExpenseExecuted;
      const globalExpensePercentage = totalExpensePlanned > 0 ? (totalExpenseExecuted / totalExpensePlanned) * 100 : 0;

      const tickerItems = useMemo(() => {
        const items = [
          { icon: '📅', label: 'Período', value: `${MONTHS[selectedMonth - 1]} / ${selectedYear}`, colorClass: 'text-indigo-300' },
          { icon: '🎯', label: 'Meta Mensal', value: `R$ ${totalExpensePlanned.toFixed(2)}`, colorClass: 'text-indigo-400' },
          { icon: '💸', label: 'Executado no Mês', value: `R$ ${totalExpenseExecuted.toFixed(2)} (${globalExpensePercentage.toFixed(1)}%)`, colorClass: 'text-amber-400' },
          { icon: '💳', label: 'Faturas do Mês', value: `R$ ${totalFaturasCartoes.toFixed(2)}`, colorClass: 'text-purple-400' },
          { icon: '💰', label: 'Saldo Restante', value: `R$ ${totalExpenseRemaining.toFixed(2)}`, colorClass: totalExpenseRemaining >= 0 ? 'text-emerald-400' : 'text-rose-400' },
        ];

        expenseCategories.forEach(cat => {
          const planned = getCategoryBudget(cat);
          if (planned <= 0) return;
          const executed = monthlyTransactions.filter(t => t.origem === cat).reduce((sum, t) => sum + (Number(t.saída) || 0), 0);
          const pct = (executed / planned) * 100;

          if (pct >= 100) {
            items.push({ icon: '🚨', label: `ALERTA: ${cat}`, value: `Excedido! (${pct.toFixed(0)}%) - R$ ${executed.toFixed(2)} / R$ ${planned.toFixed(2)}`, colorClass: 'text-rose-400 font-bold' });
          } else if (pct >= 75) {
            items.push({ icon: '⚠️', label: `Atenção: ${cat}`, value: `Atingiu ${pct.toFixed(0)}% da meta`, colorClass: 'text-amber-300 font-semibold' });
          }
        });

        return items;
      }, [selectedMonth, selectedYear, expenseCategories, budgets, monthlyTransactions, totalExpensePlanned, totalExpenseExecuted, totalExpenseRemaining, globalExpensePercentage, totalFaturasCartoes, selectedPeriodKey]);

      const filteredTransactions = useMemo(() => {
        return [...monthlyTransactions]
          .sort((a, b) => new Date(b.data).getTime() - new Date(a.data).getTime() || b.id - a.id)
          .filter(t => 
            (t.comentario || '').toLowerCase().includes(searchTx.toLowerCase()) || 
            (t.origem || '').toLowerCase().includes(searchTx.toLowerCase()) ||
            (t.classificacao || '').toLowerCase().includes(searchTx.toLowerCase())
          );
      }, [monthlyTransactions, searchTx]);

      const handleCreateTransactionSubmit = async (e) => {
        e.preventDefault();

        const payload = {
          data: newTxForm.data,
          origem: newTxForm.origem,
          classificacao: newTxForm.classificacao,
          conta: newTxForm.conta,
          cartao_id: newTxForm.operacao === 'Crédito' && newTxForm.cartaoId ? parseInt(newTxForm.cartaoId) : null,
          entrada: parseFloat(newTxForm.entrada) || 0,
          saida: parseFloat(newTxForm.saida) || 0,
          comentario: newTxForm.comentario,
          individuo: newTxForm.individuo,
          operacao: newTxForm.operacao
        };

        const { data, error } = await supabase.from('transactions').insert([payload]).select().single();

        if (!error && data) {
          const newRow = {
            id: data.id,
            data: data.data,
            origem: data.origem,
            classificacao: data.classificacao,
            conta: data.conta,
            cartaoId: data.cartao_id,
            entrada: Number(data.entrada),
            saída: Number(data.saida),
            comentario: data.comentario,
            individuo: data.individuo,
            operacao: data.operacao
          };
          setTransactions([newRow, ...transactions]);
          setShowAddTxModal(false);
          showToast('Lançamento adicionado com sucesso!');

          setNewTxForm({
            data: `${selectedPeriodKey}-01`,
            origem: Object.keys(categoriesMap)[0] || 'Dia a Dia',
            classificacao: (categoriesMap[Object.keys(categoriesMap)[0]] || ['Supermercado'])[0],
            conta: accounts[0] || 'Conta Talyson',
            operacao: 'Pix',
            cartaoId: cards[0]?.id || '',
            entrada: '',
            saida: '',
            comentario: '',
            individuo: 'Ambos'
          });
        } else {
          showToast('Erro ao salvar no banco de dados.', 'error');
          console.error(error);
        }
      };

      const handleUpdateTx = async (id, field, value) => {
        const txTarget = transactions.find(t => t.id === id);
        if (!txTarget) return;

        const updatedTx = { ...txTarget, [field]: value };
        if (field === 'origem' && categoriesMap[value]) {
          updatedTx.classificacao = categoriesMap[value][0] || 'Geral';
        }
        if (field === 'operacao' && value === 'Crédito' && !updatedTx.cartaoId && cards.length > 0) {
          updatedTx.cartaoId = cards[0].id;
        }

        setTransactions(prev => prev.map(t => t.id === id ? updatedTx : t));

        const dbPayload = {
          data: updatedTx.data,
          origem: updatedTx.origem,
          classificacao: updatedTx.classificacao,
          conta: updatedTx.conta,
          cartao_id: updatedTx.cartaoId,
          entrada: updatedTx.entrada,
          saida: updatedTx.saída,
          comentario: updatedTx.comentario,
          individuo: updatedTx.individuo,
          operacao: updatedTx.operacao
        };

        await supabase.from('transactions').update(dbPayload).eq('id', id);
      };

      const handleDeleteSingleTx = (txId) => {
        setConfirmModal({
          isOpen: true,
          title: 'Excluir Lançamento',
          message: 'Tem certeza que deseja remover este lançamento de forma permanente?',
          onConfirm: async () => {
            setTransactions(prev => prev.filter(t => t.id !== txId));
            await supabase.from('transactions').delete().eq('id', txId);
            showToast('Lançamento excluído com sucesso.');
            setConfirmModal({ isOpen: false });
          }
        });
      };

      const handleDeleteSelectedTx = () => {
        setConfirmModal({
          isOpen: true,
          title: 'Excluir Múltiplos Lançamentos',
          message: `Tem certeza que deseja excluir os ${selectedTxIds.length} lançamentos selecionados?`,
          onConfirm: async () => {
            const idsToDelete = [...selectedTxIds];
            setTransactions(prev => prev.filter(t => !idsToDelete.includes(t.id)));
            setSelectedTxIds([]);
            await supabase.from('transactions').delete().in('id', idsToDelete);
            showToast(`${idsToDelete.length} lançamentos excluídos.`);
            setConfirmModal({ isOpen: false });
          }
        });
      };

      const handleExportCSV = () => {
        const csvData = filteredTransactions.map(t => ({
          Data: t.data,
          Origem: t.origem,
          Classificação: t.classificacao,
          Conta: t.conta,
          Operação: t.operacao,
          'Cartão (ID)': t.cartaoId || '',
          Entrada: t.entrada,
          Saída: t.saída,
          Comentário: t.comentario,
          Indivíduo: t.individuo
        }));

        const csv = Papa.unparse(csvData);
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.setAttribute('download', `financas_${selectedPeriodKey}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const handleImportCSV = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        Papa.parse(file, {
          header: true,
          skipEmptyLines: true,
          complete: async (results) => {
            const rows = results.data;

            const parseCurrency = (val) => {
              if (!val) return 0;
              let s = String(val).trim().replace('R$', '').replace(/\s/g, '');
              if (!s) return 0;
              if (s.includes(',')) {
                s = s.replace(/\./g, '').replace(',', '.');
              }
              const num = parseFloat(s);
              return isNaN(num) ? 0 : num;
            };

            const parseDate = (val) => {
              if (!val) return `${selectedPeriodKey}-01`;
              let str = String(val).trim();
              if (str.includes(' ')) str = str.split(' ')[0];
              if (str.includes('T')) str = str.split('T')[0];

              if (str.includes('/')) {
                const parts = str.split('/');
                if (parts.length === 3) {
                  const d = parts[0].padStart(2, '0');
                  const m = parts[1].padStart(2, '0');
                  const y = parts[2].length === 2 ? `20${parts[2]}` : parts[2];
                  return `${y}-${m}-${d}`;
                }
              }
              if (/^\d{4}-\d{2}-\d{2}$/.test(str)) return str;
              return `${selectedPeriodKey}-01`;
            };

            const getColVal = (row, possibleKeys) => {
              const rowKeys = Object.keys(row);
              for (const pk of possibleKeys) {
                const matchedKey = rowKeys.find(k => k.trim().toUpperCase() === pk.toUpperCase() || k.trim().toUpperCase().startsWith(pk.toUpperCase()));
                if (matchedKey && row[matchedKey] !== undefined) {
                  return String(row[matchedKey]).trim();
                }
              }
              return '';
            };

            const payloads = rows.map(row => {
              const rawData = getColVal(row, ['DATA']);
              const rawOrigem = getColVal(row, ['ORIGEM/D', 'ORIGEM', 'CATEGORIA', 'DESCRICAO', 'DESCRIÇÃO']);
              const rawConta = getColVal(row, ['CONTA']);
              const rawClassific = getColVal(row, ['CLASSIFIC.', 'CLASSIFIC', 'CLASSIFICAÇÃO', 'CLASSIFICACAO']);
              const rawEntrada = getColVal(row, ['ENTRADA']);
              const rawSaida = getColVal(row, ['SAIDA', 'SAÍDA', 'VALOR']);
              const rawComenta = getColVal(row, ['COMENTA', 'COMENTÁRIO', 'COMENTARIO', 'OBSERVAÇÃO']);
              const rawIndividuo = getColVal(row, ['INDIVIDUO', 'INDIVÍDUO']);
              const rawOp = getColVal(row, ['OP', 'OPERAÇÃO', 'OPERACAO']);

              let conta = 'Conta Talyson';
              const contaUpper = rawConta.toUpperCase();
              if (contaUpper.includes('TALYSON')) conta = 'Conta Talyson';
              else if (contaUpper.includes('KARLA')) conta = 'Conta Karla';
              else if (contaUpper) conta = rawConta;

              let operacao = 'Pix';
              const opUpper = rawOp.toUpperCase();
              if (opUpper === 'DEB' || opUpper.includes('DÉBITO') || opUpper.includes('DEBITO')) operacao = 'Débito';
              else if (opUpper === 'PIX') operacao = 'Pix';
              else if (opUpper === 'CRED' || opUpper.includes('CRÉDITO') || opUpper.includes('CREDITO')) operacao = 'Crédito';
              else if (opUpper === 'TRANS' || opUpper.includes('TRANSFERÊNCIA') || opUpper.includes('TRANSFERENCIA')) operacao = 'Transferência';
              else if (opUpper.includes('DINHEIRO')) operacao = 'Dinheiro';

              let individuo = 'Ambos';
              const indUpper = rawIndividuo.toUpperCase();
              if (indUpper.includes('TALYSON')) individuo = 'Talyson';
              else if (indUpper.includes('KARLA')) individuo = 'Karla';
              else if (indUpper) individuo = rawIndividuo;

              let origem = rawOrigem || 'Dia a Dia';
              const matchedOrigem = Object.keys(DEFAULT_CATEGORIES_MAP).find(c => c.toUpperCase() === origem.toUpperCase());
              if (matchedOrigem) origem = matchedOrigem;

              let classificacao = rawClassific || (DEFAULT_CATEGORIES_MAP[origem] ? DEFAULT_CATEGORIES_MAP[origem][0] : 'Geral');

              return {
                data: parseDate(rawData),
                origem: origem,
                classificacao: classificacao,
                conta: conta,
                operacao: operacao,
                cartao_id: null,
                entrada: parseCurrency(rawEntrada),
                saida: parseCurrency(rawSaida),
                comentario: rawComenta || 'Importado via CSV',
                individuo: individuo
              };
            });

            if(payloads.length === 0) {
               showToast('Arquivo CSV vazio ou em formato inválido.', 'error');
               return;
            }

            const { data, error } = await supabase.from('transactions').insert(payloads).select();
            
            if (!error && data) {
              const newRows = data.map(d => ({
                id: d.id,
                data: d.data,
                origem: d.origem,
                classificacao: d.classificacao,
                conta: d.conta,
                cartaoId: d.cartao_id,
                entrada: Number(d.entrada),
                saída: Number(d.saida),
                comentario: d.comentario,
                individuo: d.individuo,
                operacao: d.operacao
              }));
              
              setTransactions(prev => [...newRows, ...prev]);

              if (newRows.length > 0 && newRows[0].data) {
                const parts = newRows[0].data.split('-');
                if (parts.length >= 2) {
                  const impYear = parseInt(parts[0], 10);
                  const impMonth = parseInt(parts[1], 10);
                  if (!isNaN(impYear) && !isNaN(impMonth)) {
                    setSelectedYear(impYear);
                    setSelectedMonth(impMonth);
                    showToast(`${newRows.length} linhas importadas! Exibindo período ${String(impMonth).padStart(2,'0')}/${impYear}.`);
                  } else {
                    showToast(`${newRows.length} linhas importadas com sucesso!`);
                  }
                } else {
                  showToast(`${newRows.length} linhas importadas com sucesso!`);
                }
              } else {
                showToast(`${newRows.length} linhas importadas com sucesso!`);
              }
            } else {
              showToast('Erro ao importar dados no banco.', 'error');
              console.error(error);
            }
            e.target.value = '';
          }
        });
      };

      const handleAddCardSubmit = async (e) => {
        e.preventDefault();
        if (!newCard.nome || !newCard.limite) return;

        const payload = {
          nome: newCard.nome,
          titular: newCard.titular,
          limite: parseFloat(newCard.limite) || 0,
          fatura_atual: parseFloat(newCard.faturaAtual) || 0,
          dia_fechamento: parseInt(newCard.diaFechamento) || 1,
          dia_vencimento: parseInt(newCard.diaVencimento) || 10,
          cor: newCard.cor
        };

        const { data, error } = await supabase.from('cards').insert([payload]).select().single();

        if (!error && data) {
          setCards([...cards, {
            id: data.id,
            nome: data.nome,
            titular: data.titular,
            limite: Number(data.limite),
            faturaAtual: Number(data.fatura_atual),
            diaFechamento: data.dia_fechamento,
            diaVencimento: data.dia_vencimento,
            cor: data.cor
          }]);
          setNewCard({
            nome: '',
            titular: 'Talyson',
            limite: '',
            faturaAtual: '0',
            diaFechamento: '',
            diaVencimento: '',
            cor: 'from-indigo-600 to-purple-800'
          });
          setShowAddCard(false);
          showToast('Cartão adicionado com sucesso!');
        } else {
          showToast('Erro ao salvar o cartão.', 'error');
        }
      };

      const handleDeleteCard = (cardId) => {
        setConfirmModal({
          isOpen: true,
          title: 'Remover Cartão',
          message: 'Cuidado: Remover o cartão pode afetar os lançamentos já associados a ele. Tem certeza?',
          onConfirm: async () => {
            setCards(prev => prev.filter(c => c.id !== cardId));
            if (selectedCardForDetails && selectedCardForDetails.id === cardId) {
              setSelectedCardForDetails(null);
            }
            await supabase.from('cards').delete().eq('id', cardId);
            showToast('Cartão removido.');
            setConfirmModal({ isOpen: false });
          }
        });
      };

      const handleUpdateCategoryBudget = async (category, value) => {
        const val = parseFloat(value) || 0;
        const periodKey = `${selectedPeriodKey}_${category}`;
        
        setBudgets(prev => ({
          ...prev,
          [periodKey]: val
        }));

        try {
          const { data: existing } = await supabase
            .from('budgets')
            .select('id')
            .eq('categoria', category)
            .eq('periodo', selectedPeriodKey)
            .maybeSingle();

          if (existing && existing.id) {
            await supabase
              .from('budgets')
              .update({ valor_planejado: val })
              .eq('id', existing.id);
          } else {
            await supabase
              .from('budgets')
              .insert([{
                categoria: category,
                periodo: selectedPeriodKey,
                valor_planejado: val
              }]);
          }
        } catch (err) {
          console.error("Erro ao atualizar orçamento:", err);
          showToast("Falha ao salvar orçamento no banco de dados.", "error");
        }
      };

      const handleSelectTx = (id) => {
        setSelectedTxIds(prev => prev.includes(id) ? prev.filter(i => i !== id) : [...prev, id]);
      };

      const handleSelectAllTx = (e) => {

      return (
        <div className="flex-1 flex flex-col h-full relative">

          <header className="border-b border-slate-800 bg-slate-900/90 backdrop-blur z-30 px-4 py-3 flex flex-wrap items-center justify-between gap-4 shrink-0">
            <div className="flex items-center gap-3">
              <div className="p-2 bg-gradient-to-tr from-indigo-500 via-purple-500 to-emerald-400 rounded-xl shadow-lg shadow-indigo-500/20">

              </div>
              <div>
                <h1 className="text-lg font-bold text-white flex items-center gap-2">
                  Sistema de Finanças Pessoais
                  <span className="text-[10px] uppercase font-semibold px-2 py-0.5 rounded-full bg-slate-800 text-indigo-400 border border-slate-700">Supabase DB</span>
                </h1>
                <p className="text-xs text-slate-400">Controle Orçamentário e Cartões de Crédito</p>
              </div>
            </div>

            {/* SELETOR MENSAL GLOBAL */}
            <div className="flex items-center gap-2 bg-slate-950 border border-indigo-500/30 rounded-xl p-1.5 shadow-inner">
              <button

                title="Mês Anterior"
              >
                <ChevronLeft className="w-4 h-4" />
              </button>
              
              <div className="flex items-center gap-2 px-2">
                <Calendar className="w-4 h-4 text-indigo-400" />
                <select

                  {MONTHS.map((m, idx) => (
                    <option key={m} value={idx + 1} className="bg-slate-900 text-white">{m}</option>

                </select>

                <select

                  onChange={e => setSelectedYear(Number(e.target.value))}

                    <option key={y} value={y} className="bg-slate-900 text-white">{y}</option>

                </select>
              </div>

              <button

                className="p-1.5 text-slate-400 hover:text-white bg-slate-900 hover:bg-slate-800 rounded-lg transition-colors"

              >
                <ChevronRight className="w-4 h-4" />
              </button>
            </div>

            <div className="flex items-center gap-4 border-l border-slate-800 pl-4">

              {/* ABA 1: PAINEL GERAL & HISTÓRICO */}
              {financeTab === 'painel' && (

                      <Megaphone className="w-4 h-4 text-indigo-400 animate-pulse" />
                      <span className="whitespace-nowrap uppercase tracking-wider text-[11px]">Resumo ({MONTHS[selectedMonth - 1]}/{selectedYear})</span>
                    </div>
                    <div className="overflow-hidden w-full relative">
                      <div className="animate-marquee flex items-center gap-8 text-xs font-mono">
                        {[...tickerItems, ...tickerItems].map((item, idx) => (
                          <div key={idx} className="flex items-center gap-2 whitespace-nowrap">
                            <span className="text-sm">{item.icon}</span>
                            <span className="text-slate-400">{item.label}:</span>
                            <span className={`font-semibold ${item.colorClass}`}>{item.value}</span>
                            <span className="text-slate-700 ml-4 font-normal">•</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>

                  {/* CARDS DE SALDO */}
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 hover:border-indigo-500/50 transition-colors">
                      <p className="text-xs text-slate-400 font-semibold uppercase">Conta Talyson (Total)</p>
                      <h3 className="text-2xl font-bold text-white mt-1">R$ {talysonBalance.toFixed(2)}</h3>
                      <p className="text-[10px] text-slate-500 mt-1">Saldo em Conta</p>
                    </div>
                    <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 hover:border-purple-500/50 transition-colors">
                      <p className="text-xs text-slate-400 font-semibold uppercase">Conta Karla (Total)</p>
                      <h3 className="text-2xl font-bold text-white mt-1">R$ {karlaBalance.toFixed(2)}</h3>
                      <p className="text-[10px] text-slate-500 mt-1">Saldo em Conta</p>
                    </div>
                    <div className="bg-gradient-to-br from-indigo-900/40 to-purple-900/40 border border-indigo-500/30 rounded-xl p-5 relative overflow-hidden group">
                      <div className="absolute inset-0 bg-gradient-to-r from-indigo-500/10 to-purple-500/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                      <p className="text-xs text-indigo-300 font-semibold uppercase relative z-10">Saldo Consolidado</p>
                      <h3 className="text-3xl font-extrabold text-white mt-1 relative z-10">R$ {consolidatedBalance.toFixed(2)}</h3>
                      <p className="text-[10px] text-indigo-300/70 mt-1 relative z-10">Disponível em Dinheiro/Pix</p>
                    </div>
                    <div className="bg-slate-900 border border-purple-500/30 rounded-xl p-5 hover:border-purple-400/60 transition-colors">
                      <p className="text-xs text-purple-400 font-semibold uppercase">Faturas ({MONTHS[selectedMonth - 1]})</p>
                      <h3 className="text-2xl font-bold text-purple-300 mt-1">R$ {totalFaturasCartoes.toFixed(2)}</h3>
                      <p className="text-[10px] text-slate-500 mt-1">Gasto em Crédito no Mês</p>
                    </div>
                  </div>

                  {/* TABELA HISTÓRICO */}
                  <div className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-xl flex flex-col h-[600px]">
                    <div className="p-4 border-b border-slate-800 flex flex-wrap items-center justify-between gap-4 shrink-0 bg-slate-900/95">
                      <div className="flex items-center gap-3 flex-wrap">
                        <span className="text-sm font-bold flex items-center gap-2">
                          Histórico de Lançamentos
                          <span className="text-xs font-normal text-indigo-400 bg-indigo-500/10 px-2 py-0.5 rounded border border-indigo-500/20">
                            {showAllMonths ? 'Todos os Meses' : `${MONTHS[selectedMonth - 1]} / ${selectedYear}`} ({filteredTransactions.length})
                          </span>

                        <div className="flex items-center gap-2 border-l border-slate-800 pl-4">

                          <label className="text-xs border border-slate-800 bg-slate-950 text-amber-400 hover:bg-slate-800 px-3 py-1.5 rounded font-semibold transition-colors flex items-center gap-1.5 cursor-pointer">

                      </div>

                      <div className="flex items-center gap-2 flex-wrap">
                        <input
                          type="text"
                          placeholder="Buscar no mês..."
                          value={searchTx}
                          onChange={e => setSearchTx(e.target.value)}
                          className="bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500 min-w-[200px]"
                        />
                        <button
                          onClick={() => setShowAddTxModal(true)}
                          className="flex items-center gap-1.5 bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-xs font-semibold shadow-lg shadow-indigo-600/30 transition-all"
                        >
                          <Plus className="w-4 h-4" /> Novo Lançamento
                        </button>
                        {selectedTxIds.length > 0 && (
                          <button onClick={handleDeleteSelectedTx} className="flex items-center gap-1 bg-rose-600/90 hover:bg-rose-500 text-white px-3 py-2 rounded-lg text-xs font-semibold transition-colors">
                            <Trash2 className="w-4 h-4" /> Excluir ({selectedTxIds.length})
                          </button>
                        )}
                      </div>
                    </div>

                    <div className="overflow-x-auto flex-1 overflow-y-auto">
                      <table className="w-full text-left text-xs whitespace-nowrap">
                        <thead className="bg-slate-950 text-slate-400 uppercase font-mono border-b border-slate-800 sticky top-0 z-10">
                          <tr>
                            <th className="p-3 w-10 text-center"><input type="checkbox" className="accent-indigo-500 cursor-pointer w-3.5 h-3.5 rounded" onChange={handleSelectAllTx} checked={selectedTxIds.length === filteredTransactions.length && filteredTransactions.length > 0} /></th>
                            <th className="p-3 min-w-[130px]">1. Data</th>
                            <th className="p-3 min-w-[160px]">2. Origem/Destino</th>
                            <th className="p-3 min-w-[170px]">3. Classificação</th>
                            <th className="p-3 min-w-[140px]">4. Conta</th>

                            <th className="p-3 min-w-[120px] text-right">7. Entrada (R$)</th>
                            <th className="p-3 min-w-[120px] text-right">8. Saída (R$)</th>
                            <th className="p-3 min-w-[200px]">9. Comentário</th>
                            <th className="p-3 min-w-[120px]">10. Indivíduo</th>
                            <th className="p-3 w-12 text-center">Ações</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-800">
                          {filteredTransactions.length === 0 ? (
                            <tr>
                              <td colSpan="12" className="p-8 text-center text-slate-500">
                                <div className="flex flex-col items-center justify-center gap-2">
                                  <Info className="w-8 h-8 text-slate-600" />
                                  <p>Nenhum lançamento encontrado para este período.</p>
                                </div>
                              </td>
                            </tr>
                          ) : (
                            filteredTransactions.map(tx => (
                              <tr key={tx.id} className={`hover:bg-slate-800/50 transition-colors ${selectedTxIds.includes(tx.id) ? 'bg-indigo-900/10' : ''}`}>
                                <td className="p-3 text-center">
                                  <input type="checkbox" className="accent-indigo-500 cursor-pointer w-3.5 h-3.5 rounded" checked={selectedTxIds.includes(tx.id)} onChange={() => handleSelectTx(tx.id)} />
                                </td>
                                
                                <td className="p-2">
                                  {spreadsheetMode ? (
                                    <input type="date" value={tx.data} onChange={e => handleUpdateTx(tx.id, 'data', e.target.value)} className="bg-slate-950 border border-slate-700 rounded px-2 py-1 w-full text-white focus:border-indigo-500 focus:outline-none" />
                                  ) : <span className="font-mono">{tx.data.split('-').reverse().join('/')}</span>}
                                </td>
                                
                                <td className="p-2">
                                  {spreadsheetMode ? (
                                    <select value={tx.origem} onChange={e => {
                                      if (e.target.value === '___NEW___') {
                                        handleOpenCustomModal('origem');
                                      } else {
                                        handleUpdateTx(tx.id, 'origem', e.target.value);
                                      }
                                    }} className="bg-slate-950 border border-slate-700 rounded px-2 py-1 w-full text-white focus:border-indigo-500 focus:outline-none">
                                      {Object.keys(categoriesMap).map(cat => <option key={cat} value={cat}>{cat}</option>)}
                                      <option value="___NEW___" className="text-indigo-400 font-bold">+ Adicionar Categoria...</option>
                                    </select>
                                  ) : <span className="font-semibold text-slate-300">{tx.origem}</span>}
                                </td>
                                
                                <td className="p-2">
                                  {spreadsheetMode ? (
                                    <select value={tx.classificacao} onChange={e => {
                                      if (e.target.value === '___NEW___') {
                                        handleOpenCustomModal('classificacao', tx.origem);
                                      } else {
                                        handleUpdateTx(tx.id, 'classificacao', e.target.value);
                                      }
                                    }} className="bg-slate-950 border border-slate-700 rounded px-2 py-1 w-full text-white focus:border-indigo-500 focus:outline-none">
                                      {(categoriesMap[tx.origem] || ['Geral']).map(cls => <option key={cls} value={cls}>{cls}</option>)}

                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-1">Dia Vencimento</label>
                      <input type="number" required min="1" max="31" placeholder="Ex: 12" className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white text-sm focus:border-purple-500 focus:outline-none"
                        value={newCard.diaVencimento} onChange={e => setNewCard({...newCard, diaVencimento: e.target.value})} />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-2">Cor do Cartão</label>
                    <div className="flex gap-2 flex-wrap">
                      {GRADIENTS.map(grad => (
                        <button
                          key={grad.value}
                          type="button"
                          onClick={() => setNewCard({...newCard, cor: grad.value})}
                          className={`w-8 h-8 rounded-full bg-gradient-to-br ${grad.value} ring-2 ring-offset-2 ring-offset-slate-900 transition-all ${newCard.cor === grad.value ? 'ring-white scale-110' : 'ring-transparent hover:scale-105'}`}
                          title={grad.label}
                        ></button>
                      ))}
                    </div>
                  </div>
                  
                  <div className="pt-4 mt-4 border-t border-slate-800 flex justify-end gap-3">
                    <button type="button" onClick={() => setShowAddCard(false)} className="px-4 py-2 text-sm text-slate-300 hover:text-white transition-colors">Cancelar</button>
                    <button type="submit" className="px-6 py-2 bg-purple-600 hover:bg-purple-500 text-white text-sm font-semibold rounded-lg flex items-center gap-2 shadow-lg shadow-purple-600/20 transition-all">
                      <Save className="w-4 h-4" /> Cadastrar Cartão
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: CUSTOM ADD ITEM */}
          {customModal.isOpen && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-[60] flex justify-center items-center p-4">
              <div className="bg-slate-900 border border-slate-700 shadow-2xl rounded-2xl w-full max-w-md overflow-hidden">
                <div className="bg-slate-950 px-6 py-4 border-b border-slate-800 flex justify-between items-center">
                  <h3 className="font-bold text-md text-white flex items-center gap-2">
                    <Plus className="w-4 h-4 text-indigo-400" />
                    {customModal.type === 'origem' && 'Cadastrar Nova Categoria (Origem)'}
                    {customModal.type === 'classificacao' && `Cadastrar Classificação em "${customModal.categoryTarget || newTxForm.origem}"`}
                    {customModal.type === 'conta' && 'Cadastrar Nova Conta Bancária'}
                  </h3>
                  <button onClick={() => setCustomModal({ isOpen: false, type: '', categoryTarget: '', name: '' })} className="text-slate-400 hover:text-white transition-colors bg-slate-800 p-1 rounded-full"><X className="w-4 h-4"/></button>
                </div>
                
                <form onSubmit={handleAddCustomItemSubmit} className="p-6 space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1">
                      {customModal.type === 'origem' && 'Nome da Categoria'}
                      {customModal.type === 'classificacao' && 'Nome da Sub-classificação'}
                      {customModal.type === 'conta' && 'Nome da Conta / Instituição'}
                    </label>
                    <input 
                      type="text" 
                      required 
                      autoFocus
                      placeholder="Digite o nome..." 
                      className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white text-sm focus:border-indigo-500 focus:outline-none"
                      value={customModal.name} 
                      onChange={e => setCustomModal({...customModal, name: e.target.value})} 
                    />
                  </div>

                  <div className="pt-2 flex justify-end gap-3">
                    <button type="button" onClick={() => setCustomModal({ isOpen: false, type: '', categoryTarget: '', name: '' })} className="px-4 py-2 text-xs text-slate-300 hover:text-white">Cancelar</button>
                    <button type="submit" className="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-lg flex items-center gap-1.5 shadow-lg shadow-indigo-600/20">
                      <Save className="w-3.5 h-3.5" /> Salvar
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* CUSTOM CONFIRM MODAL */}
          {confirmModal.isOpen && (
            <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
              <div className="bg-slate-900 border border-slate-700 rounded-xl max-w-sm w-full p-6 shadow-2xl">
                <div className="flex items-center gap-3 mb-4 text-rose-400">
                  <AlertTriangle className="w-6 h-6" />
                  <h3 className="text-lg font-bold">{confirmModal.title}</h3>
                </div>
                <p className="text-slate-300 text-sm mb-6">{confirmModal.message}</p>
                <div className="flex justify-end gap-3">
                  <button onClick={() => setConfirmModal({ isOpen: false })} className="px-4 py-2 text-sm font-semibold text-slate-400 hover:text-white transition-colors">
                    Cancelar
                  </button>
                  <button onClick={confirmModal.onConfirm} className="px-4 py-2 text-sm font-semibold bg-rose-600 hover:bg-rose-500 text-white rounded-lg transition-colors shadow-lg shadow-rose-600/20">
                    Confirmar Exclusão
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* TOAST NOTIFICATION */}
          {toast && (
            <div className="fixed bottom-6 right-6 z-[100]">
              <div className={`flex items-center gap-3 px-4 py-3 rounded-xl shadow-2xl border ${toast.type === 'success' ? 'bg-emerald-950/80 border-emerald-500/30 text-emerald-100' : 'bg-rose-950/80 border-rose-500/30 text-rose-100'} backdrop-blur-md`}>
                {toast.type === 'success' ? <CheckCircle2 className="w-5 h-5 text-emerald-400" /> : <AlertTriangle className="w-5 h-5 text-rose-400" />}
                <p className="text-sm font-medium">{toast.message}</p>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
