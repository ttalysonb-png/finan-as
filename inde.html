<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Finanças Pessoais (Supabase)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.344.0?external=react",
        "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
      }
    }
  </script>
  <style>
    @keyframes marquee {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-50%); }
    }
    .animate-marquee {
      display: flex;
      width: max-content;
      animation: marquee 70s linear infinite;
    }
    .animate-marquee:hover {
      animation-play-state: paused;
    }
    
    /* Custom scrollbar for a cleaner look */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a; 
    }
    ::-webkit-scrollbar-thumb {
      background: #334155; 
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569; 
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans selection:bg-indigo-500 selection:text-white overflow-hidden">
  <div id="root" class="h-screen w-screen flex flex-col"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useMemo } from 'react';
    import { createRoot } from 'react-dom/client';
    import { createClient } from '@supabase/supabase-js';
    import {
      Wallet, CreditCard, Plus, Trash2, Target, Edit3, AlertTriangle, CheckCircle2, Megaphone, Calendar, X, Eye, RefreshCw, ChevronLeft, ChevronRight, Save, Info, Check
    } from 'lucide-react';

    // CONFIGURAÇÃO DO SUPABASE
    const SUPABASE_URL = 'https://zvqjtkwaxxtyhfrxmmvk.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_MdSZpVGO7E3ezVOTVEdtFg_OCFdi_Zr';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const MONTHS = [
      'Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho',
      'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'
    ];

    const CATEGORIES_MAP = {
      'Cartão de Crédito': ['Fatura', 'Anuidade', 'Parcela', 'Juros/Encargos'],
      'Comunicação': ['Internet', 'Telefone Fixo', 'Celular/Plano', 'TV por Assinatura'],
      'Crianças': ['Escola/Creche', 'Brinquedos', 'Vestuário Infantil', 'Atividades/Esportes', 'Pediatra/Saúde'],
      'Cuidados Pessoais': ['Salão/Barbearia', 'Cosméticos/Perfumaria', 'Farmácia', 'Estética/Academia'],
      'Dia a Dia': ['Supermercado', 'Padaria', 'Feira/Hortifruti', 'Lanches', 'Conveniência'],
      'Educação': ['Cursos', 'Livros', 'Mensalidade', 'Material Escolar/Escritório'],
      'Emprestado': ['Empréstimo Concedido', 'Devolução de Empréstimo', 'Ajuste de Saldo'],
      'Infraestrutura': ['Aluguel', 'Condomínio', 'Luz (Energia)', 'Água', 'Gás', 'IPTU', 'Manutenção Doméstica'],
      'Lazer': ['Viagens', 'Streaming/Assinaturas', 'Restaurantes/Bares', 'Cinema/Shows', 'Hobbies'],
      'Presentes': ['Aniversário', 'Natal', 'Datas Especiais', 'Lembrancinhas'],
      'Trabalho': ['Salário', 'Bônus/PLR', 'Freelance/Serviços', 'Ferramentas/Softwares'],
      'Transferência': ['Entre Contas Próprias', 'Aporte Investimentos', 'Resgate Investimentos'],
      'Transporte': ['Combustível', 'Uber/App', 'Manutenção Veicular', 'Seguro Veicular', 'IPVA/Licenciamento', 'Pedágio/Estacionamento'],
      'Vestuário': ['Roupas', 'Calçados', 'Acessórios']
    };

    const GRADIENTS = [
      { label: 'Roxo / Índigo', value: 'from-indigo-600 to-purple-800' },
      { label: 'Rosa / Violeta', value: 'from-purple-600 to-pink-700' },
      { label: 'Verde / Esmeralda', value: 'from-emerald-600 to-teal-800' },
      { label: 'Azul / Ciano', value: 'from-blue-600 to-cyan-800' },
      { label: 'Laranja / Amarelo', value: 'from-amber-600 to-orange-800' },
      { label: 'Cinza / Escuro', value: 'from-slate-700 to-slate-900' },
      { label: 'Vermelho / Rubi', value: 'from-rose-600 to-red-900' }
    ];

    function App() {
      const currentDate = new Date();
      const [selectedYear, setSelectedYear] = useState(currentDate.getFullYear());
      const [selectedMonth, setSelectedMonth] = useState(currentDate.getMonth() + 1);

      const [financeTab, setFinanceTab] = useState('painel');
      const [loading, setLoading] = useState(true);
      const [transactions, setTransactions] = useState([]);
      const [budgets, setBudgets] = useState({});
      const [cards, setCards] = useState([]);
      const [editingCategory, setEditingCategory] = useState(null);
      const [spreadsheetMode, setSpreadsheetMode] = useState(false);
      const [selectedTxIds, setSelectedTxIds] = useState([]);
      const [searchTx, setSearchTx] = useState('');

      // Custom Modals and Toasts (Replacing alert/confirm)
      const [toast, setToast] = useState(null); // { message: string, type: 'success' | 'error' }
      const [confirmModal, setConfirmModal] = useState({ isOpen: false, title: '', message: '', onConfirm: null });

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 4000);
      };

      // STRING FORMATADA PARA FILTRO (YYYY-MM)
      const selectedPeriodKey = useMemo(() => {
        const m = String(selectedMonth).padStart(2, '0');
        return `${selectedYear}-${m}`;
      }, [selectedYear, selectedMonth]);

      // POP-UP NOVO LANÇAMENTO
      const [showAddTxModal, setShowAddTxModal] = useState(false);
      const [newTxForm, setNewTxForm] = useState({
        data: `${selectedPeriodKey}-01`,
        origem: 'Dia a Dia',
        classificacao: 'Supermercado',
        conta: 'Conta Talyson',
        operacao: 'Pix',
        cartaoId: '',
        entrada: '',
        saida: '',
        comentario: '',
        individuo: 'Ambos'
      });

      useEffect(() => {
        const today = new Date().toISOString().split('T')[0];
        if (today.startsWith(selectedPeriodKey)) {
          setNewTxForm(prev => ({ ...prev, data: today }));
        } else {
          setNewTxForm(prev => ({ ...prev, data: `${selectedPeriodKey}-01` }));
        }
      }, [selectedPeriodKey]);

      const [selectedCardForDetails, setSelectedCardForDetails] = useState(null);
      const [showAddCard, setShowAddCard] = useState(false);
      const [newCard, setNewCard] = useState({
        nome: '',
        titular: 'Talyson',
        limite: '',
        faturaAtual: '0',
        diaFechamento: '',
        diaVencimento: '',
        cor: 'from-indigo-600 to-purple-800'
      });

      // BUSCAR DADOS DO SUPABASE
      const fetchDatabaseData = async () => {
        setLoading(true);
        try {
          const [cardsRes, budgetsRes, txRes] = await Promise.all([
            supabase.from('cards').select('*').order('id', { ascending: true }),
            supabase.from('budgets').select('*'),
            supabase.from('transactions').select('*').order('data', { ascending: false }).order('id', { ascending: false })
          ]);

          if (cardsRes.data) {
            setCards(cardsRes.data.map(c => ({
              id: c.id,
              nome: c.nome,
              titular: c.titular,
              limite: Number(c.limite),
              faturaAtual: Number(c.fatura_atual),
              diaFechamento: c.dia_fechamento,
              diaVencimento: c.dia_vencimento,
              cor: c.cor
            })));
          }

          if (budgetsRes.data) {
            const bMap = {};
            budgetsRes.data.forEach(b => {
              if (b.periodo) {
                bMap[`${b.periodo}_${b.categoria}`] = Number(b.valor_planejado);
              } else {
                bMap[b.categoria] = Number(b.valor_planejado);
              }
            });
            setBudgets(bMap);
          }

          if (txRes.data) {
            setTransactions(txRes.data.map(t => ({
              id: t.id,
              data: t.data,
              origem: t.origem,
              classificacao: t.classificacao,
              conta: t.conta,
              cartaoId: t.cartao_id,
              entrada: Number(t.entrada),
              saída: Number(t.saida),
              comentario: t.comentario,
              individuo: t.individuo,
              operacao: t.operacao
            })));
          }
        } catch (err) {
          console.error("Erro ao carregar dados do Supabase:", err);
          showToast("Erro de conexão com o banco de dados.", "error");
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchDatabaseData();
      }, []);

      // TRANSAÇÕES FILTRADAS POR MÊS E ANO
      const monthlyTransactions = useMemo(() => {
        return transactions.filter(t => t.data && t.data.startsWith(selectedPeriodKey));
      }, [transactions, selectedPeriodKey]);

      // RETORNA O ORÇAMENTO PLANEJADO DA CATEGORIA NO MÊS SELECIONADO
      const getCategoryBudget = (category) => {
        const periodKey = `${selectedPeriodKey}_${category}`;
        if (budgets[periodKey] !== undefined) return budgets[periodKey];
        return budgets[category] || 0;
      };

      const handlePrevMonth = () => {
        if (selectedMonth === 1) {
          setSelectedMonth(12);
          setSelectedYear(prev => prev - 1);
        } else {
          setSelectedMonth(prev => prev - 1);
        }
      };

      const handleNextMonth = () => {
        if (selectedMonth === 12) {
          setSelectedMonth(1);
          setSelectedYear(prev => prev + 1);
        } else {
          setSelectedMonth(prev => prev + 1);
        }
      };

      // CÁLCULO DE SALDOS
      const talysonBalance = useMemo(() => {
        return transactions
          .filter(t => t.conta === 'Conta Talyson')
          .reduce((acc, t) => {
            const entrada = Number(t.entrada) || 0;
            const saida = t.operacao === 'Crédito' ? 0 : (Number(t.saída) || 0);
            return acc + entrada - saida;
          }, 0.00);
      }, [transactions]);

      const karlaBalance = useMemo(() => {
        return transactions
          .filter(t => t.conta === 'Conta Karla')
          .reduce((acc, t) => {
            const entrada = Number(t.entrada) || 0;
            const saida = t.operacao === 'Crédito' ? 0 : (Number(t.saída) || 0);
            return acc + entrada - saida;
          }, 0.00);
      }, [transactions]);

      const consolidatedBalance = talysonBalance + karlaBalance;

      const getCardInvoice = (cardId, baseValue) => {
        const creditSum = monthlyTransactions
          .filter(t => t.operacao === 'Crédito' && Number(t.cartaoId) === Number(cardId))
          .reduce((sum, t) => sum + (Number(t.saída) || 0), 0);
        return (Number(baseValue) || 0) + creditSum;
      };

      const totalFaturasCartoes = useMemo(() => {
        return cards.reduce((acc, c) => acc + getCardInvoice(c.id, c.faturaAtual), 0);
      }, [cards, monthlyTransactions]);

      const expenseCategories = useMemo(() => Object.keys(CATEGORIES_MAP).filter(cat => cat !== 'Trabalho'), []);

      // ORÇAMENTO TOTAL FILTRADO PELO MÊS SELECIONADO
      const totalExpensePlanned = useMemo(() => {
        return expenseCategories.reduce((sum, cat) => sum + getCategoryBudget(cat), 0);
      }, [budgets, expenseCategories, selectedPeriodKey]);

      const totalExpenseExecuted = useMemo(() => {
        return monthlyTransactions
          .filter(t => expenseCategories.includes(t.origem))
          .reduce((sum, t) => sum + (Number(t.saída) || 0), 0);
      }, [monthlyTransactions, expenseCategories]);

      const totalExpenseRemaining = totalExpensePlanned - totalExpenseExecuted;
      const globalExpensePercentage = totalExpensePlanned > 0 ? (totalExpenseExecuted / totalExpensePlanned) * 100 : 0;

      const tickerItems = useMemo(() => {
        const items = [
          { icon: '📅', label: 'Período', value: `${MONTHS[selectedMonth - 1]} / ${selectedYear}`, colorClass: 'text-indigo-300' },
          { icon: '🎯', label: 'Meta Mensal', value: `R$ ${totalExpensePlanned.toFixed(2)}`, colorClass: 'text-indigo-400' },
          { icon: '💸', label: 'Executado no Mês', value: `R$ ${totalExpenseExecuted.toFixed(2)} (${globalExpensePercentage.toFixed(1)}%)`, colorClass: 'text-amber-400' },
          { icon: '💳', label: 'Faturas do Mês', value: `R$ ${totalFaturasCartoes.toFixed(2)}`, colorClass: 'text-purple-400' },
          { icon: '💰', label: 'Saldo Restante', value: `R$ ${totalExpenseRemaining.toFixed(2)}`, colorClass: totalExpenseRemaining >= 0 ? 'text-emerald-400' : 'text-rose-400' },
        ];

        expenseCategories.forEach(cat => {
          const planned = getCategoryBudget(cat);
          if (planned <= 0) return;
          const executed = monthlyTransactions.filter(t => t.origem === cat).reduce((sum, t) => sum + (Number(t.saída) || 0), 0);
          const pct = (executed / planned) * 100;

          if (pct >= 100) {
            items.push({ icon: '🚨', label: `ALERTA: ${cat}`, value: `Excedido! (${pct.toFixed(0)}%) - R$ ${executed.toFixed(2)} / R$ ${planned.toFixed(2)}`, colorClass: 'text-rose-400 font-bold' });
          } else if (pct >= 75) {
            items.push({ icon: '⚠️', label: `Atenção: ${cat}`, value: `Atingiu ${pct.toFixed(0)}% da meta`, colorClass: 'text-amber-300 font-semibold' });
          }
        });

        return items;
      }, [selectedMonth, selectedYear, expenseCategories, budgets, monthlyTransactions, totalExpensePlanned, totalExpenseExecuted, totalExpenseRemaining, globalExpensePercentage, totalFaturasCartoes, selectedPeriodKey]);

      const filteredTransactions = useMemo(() => {
        return [...monthlyTransactions]
          .sort((a, b) => new Date(b.data).getTime() - new Date(a.data).getTime() || b.id - a.id)
          .filter(t => t.comentario.toLowerCase().includes(searchTx.toLowerCase()) || t.origem.toLowerCase().includes(searchTx.toLowerCase()));
      }, [monthlyTransactions, searchTx]);

      const handleCreateTransactionSubmit = async (e) => {
        e.preventDefault();

        const payload = {
          data: newTxForm.data,
          origem: newTxForm.origem,
          classificacao: newTxForm.classificacao,
          conta: newTxForm.conta,
          cartao_id: newTxForm.operacao === 'Crédito' && newTxForm.cartaoId ? parseInt(newTxForm.cartaoId) : null,
          entrada: parseFloat(newTxForm.entrada) || 0,
          saida: parseFloat(newTxForm.saida) || 0,
          comentario: newTxForm.comentario,
          individuo: newTxForm.individuo,
          operacao: newTxForm.operacao
        };

        const { data, error } = await supabase.from('transactions').insert([payload]).select().single();

        if (!error && data) {
          const newRow = {
            id: data.id,
            data: data.data,
            origem: data.origem,
            classificacao: data.classificacao,
            conta: data.conta,
            cartaoId: data.cartao_id,
            entrada: Number(data.entrada),
            saída: Number(data.saida),
            comentario: data.comentario,
            individuo: data.individuo,
            operacao: data.operacao
          };
          setTransactions([newRow, ...transactions]);
          setShowAddTxModal(false);
          showToast('Lançamento adicionado com sucesso!');

          setNewTxForm({
            data: `${selectedPeriodKey}-01`,
            origem: 'Dia a Dia',
            classificacao: 'Supermercado',
            conta: 'Conta Talyson',
            operacao: 'Pix',
            cartaoId: cards[0]?.id || '',
            entrada: '',
            saida: '',
            comentario: '',
            individuo: 'Ambos'
          });
        } else {
          showToast('Erro ao salvar no banco de dados.', 'error');
          console.error(error);
        }
      };

      const handleUpdateTx = async (id, field, value) => {
        const txTarget = transactions.find(t => t.id === id);
        if (!txTarget) return;

        const updatedTx = { ...txTarget, [field]: value };
        if (field === 'origem' && CATEGORIES_MAP[value]) {
          updatedTx.classificacao = CATEGORIES_MAP[value][0];
        }
        if (field === 'operacao' && value === 'Crédito' && !updatedTx.cartaoId && cards.length > 0) {
          updatedTx.cartaoId = cards[0].id;
        }

        setTransactions(prev => prev.map(t => t.id === id ? updatedTx : t));

        const dbPayload = {
          data: updatedTx.data,
          origem: updatedTx.origem,
          classificacao: updatedTx.classificacao,
          conta: updatedTx.conta,
          cartao_id: updatedTx.cartaoId,
          entrada: updatedTx.entrada,
          saida: updatedTx.saída,
          comentario: updatedTx.comentario,
          individuo: updatedTx.individuo,
          operacao: updatedTx.operacao
        };

        await supabase.from('transactions').update(dbPayload).eq('id', id);
      };

      const handleDeleteSingleTx = (txId) => {
        setConfirmModal({
          isOpen: true,
          title: 'Excluir Lançamento',
          message: 'Tem certeza que deseja remover este lançamento de forma permanente?',
          onConfirm: async () => {
            setTransactions(prev => prev.filter(t => t.id !== txId));
            await supabase.from('transactions').delete().eq('id', txId);
            showToast('Lançamento excluído com sucesso.');
            setConfirmModal({ isOpen: false });
          }
        });
      };

      const handleDeleteSelectedTx = () => {
        setConfirmModal({
          isOpen: true,
          title: 'Excluir Múltiplos Lançamentos',
          message: `Tem certeza que deseja excluir os ${selectedTxIds.length} lançamentos selecionados?`,
          onConfirm: async () => {
            const idsToDelete = [...selectedTxIds];
            setTransactions(prev => prev.filter(t => !idsToDelete.includes(t.id)));
            setSelectedTxIds([]);
            await supabase.from('transactions').delete().in('id', idsToDelete);
            showToast(`${idsToDelete.length} lançamentos excluídos.`);
            setConfirmModal({ isOpen: false });
          }
        });
      };

      const handleAddCardSubmit = async (e) => {
        e.preventDefault();
        if (!newCard.nome || !newCard.limite) return;

        const payload = {
          nome: newCard.nome,
          titular: newCard.titular,
          limite: parseFloat(newCard.limite) || 0,
          fatura_atual: parseFloat(newCard.faturaAtual) || 0,
          dia_fechamento: parseInt(newCard.diaFechamento) || 1,
          dia_vencimento: parseInt(newCard.diaVencimento) || 10,
          cor: newCard.cor
        };

        const { data, error } = await supabase.from('cards').insert([payload]).select().single();

        if (!error && data) {
          setCards([...cards, {
            id: data.id,
            nome: data.nome,
            titular: data.titular,
            limite: Number(data.limite),
            faturaAtual: Number(data.fatura_atual),
            diaFechamento: data.dia_fechamento,
            diaVencimento: data.dia_vencimento,
            cor: data.cor
          }]);
          setNewCard({
            nome: '',
            titular: 'Talyson',
            limite: '',
            faturaAtual: '0',
            diaFechamento: '',
            diaVencimento: '',
            cor: 'from-indigo-600 to-purple-800'
          });
          setShowAddCard(false);
          showToast('Cartão adicionado com sucesso!');
        } else {
          showToast('Erro ao salvar o cartão.', 'error');
        }
      };

      const handleDeleteCard = (cardId) => {
        setConfirmModal({
          isOpen: true,
          title: 'Remover Cartão',
          message: 'Cuidado: Remover o cartão pode afetar os lançamentos já associados a ele. Tem certeza?',
          onConfirm: async () => {
            setCards(prev => prev.filter(c => c.id !== cardId));
            if (selectedCardForDetails && selectedCardForDetails.id === cardId) {
              setSelectedCardForDetails(null);
            }
            await supabase.from('cards').delete().eq('id', cardId);
            showToast('Cartão removido.');
            setConfirmModal({ isOpen: false });
          }
        });
      };

      // ATUALIZA ORÇAMENTO PLANEJADO NO MÊS ESPECÍFICO
      const handleUpdateCategoryBudget = async (category, value) => {
        const val = parseFloat(value) || 0;
        const periodKey = `${selectedPeriodKey}_${category}`;
        
        // Atualiza estritamente o mês específico na interface
        setBudgets(prev => ({
          ...prev,
          [periodKey]: val
        }));

        try {
          // 1. Verifica se já existe um orçamento salvo para esta categoria NESTE exato mês
          const { data: existing } = await supabase
            .from('budgets')
            .select('id')
            .eq('categoria', category)
            .eq('periodo', selectedPeriodKey)
            .maybeSingle(); // Retorna o item se existir, ou null se não existir

          if (existing && existing.id) {
            // 2. Se existe, atualiza apenas o registro deste mês
            await supabase
              .from('budgets')
              .update({ valor_planejado: val })
              .eq('id', existing.id);
          } else {
            // 3. Se não existe, cria um registro exclusivo para este mês
            await supabase
              .from('budgets')
              .insert([{
                categoria: category,
                periodo: selectedPeriodKey,
                valor_planejado: val
              }]);
          }
        } catch (err) {
          console.error("Erro ao atualizar orçamento:", err);
          showToast("Falha ao salvar orçamento no banco de dados.", "error");
        }
      };

      const handleSelectTx = (id) => {
        setSelectedTxIds(prev => prev.includes(id) ? prev.filter(i => i !== id) : [...prev, id]);
      };

      const handleSelectAllTx = (e) => {
        setSelectedTxIds(e.target.checked ? filteredTransactions.map(t => t.id) : []);
      };

      return (
        <div className="flex-1 flex flex-col h-full relative">
          {/* HEADER COM FILTRO DE MÊS E ANO */}
          <header className="border-b border-slate-800 bg-slate-900/90 backdrop-blur z-30 px-4 py-3 flex flex-wrap items-center justify-between gap-4 shrink-0">
            <div className="flex items-center gap-3">
              <div className="p-2 bg-gradient-to-tr from-indigo-500 via-purple-500 to-emerald-400 rounded-xl shadow-lg shadow-indigo-500/20">
                <Wallet className="w-6 h-6 text-slate-950 font-bold" />
              </div>
              <div>
                <h1 className="text-lg font-bold text-white flex items-center gap-2">
                  Sistema de Finanças Pessoais
                  <span className="text-[10px] uppercase font-semibold px-2 py-0.5 rounded-full bg-slate-800 text-indigo-400 border border-slate-700">Supabase DB</span>
                </h1>
                <p className="text-xs text-slate-400">Controle Orçamentário e Cartões de Crédito</p>
              </div>
            </div>

            {/* SELETOR MENSAL GLOBAL */}
            <div className="flex items-center gap-2 bg-slate-950 border border-indigo-500/30 rounded-xl p-1.5 shadow-inner">
              <button
                onClick={handlePrevMonth}
                className="p-1.5 text-slate-400 hover:text-white bg-slate-900 hover:bg-slate-800 rounded-lg transition-colors"
                title="Mês Anterior"
              >
                <ChevronLeft className="w-4 h-4" />
              </button>
              
              <div className="flex items-center gap-2 px-2">

                          <div key={card.id} className="relative group perspective-1000">
                            {/* Visual do Cartão Físico */}
                            <div className={`w-full h-48 rounded-2xl bg-gradient-to-br ${card.cor || 'from-slate-700 to-slate-900'} p-5 shadow-xl flex flex-col justify-between text-white relative overflow-hidden ring-1 ring-white/20`}>
                              {/* Elementos Decorativos */}
                              <div className="absolute top-0 right-0 w-32 h-32 bg-white/10 rounded-full blur-2xl -mr-10 -mt-10 pointer-events-none"></div>
                              <div className="absolute bottom-0 left-0 w-24 h-24 bg-black/10 rounded-full blur-xl pointer-events-none"></div>
                              
                              <div className="flex justify-between items-start relative z-10">
                                <span className="font-extrabold text-lg tracking-wider opacity-90">{card.nome}</span>
                                <div className="flex gap-1.5">
                                  <div className="w-6 h-6 rounded-full bg-white/20 backdrop-blur-sm flex items-center justify-center">
                                    <CreditCard className="w-3.5 h-3.5 text-white/80" />
                                  </div>
                                </div>
                              </div>

                              <div className="space-y-4 relative z-10">
                                <div className="flex justify-between items-end">
                                  <div>
                                    <p className="text-[10px] text-white/60 uppercase tracking-wider mb-0.5">Titular</p>
                                    <p className="font-mono text-sm tracking-widest">{card.titular.toUpperCase()}</p>
                                  </div>
                                  <div className="text-right">
                                    <p className="text-[10px] text-white/60 uppercase tracking-wider mb-0.5">Venc.</p>
                                    <p className="font-mono text-sm font-bold">Dia {card.diaVencimento}</p>
                                  </div>
                                </div>
                              </div>
                            </div>

                            {/* Informações de Limite Acopladas Abaixo */}
                            <div className="bg-slate-900 border border-slate-800 rounded-b-xl -mt-4 pt-8 pb-4 px-5 shadow-lg relative z-0">
                              <div className="flex justify-between text-xs mb-2">
                                <span className="text-slate-400">Limite Utilizado</span>
                                <span className="font-bold text-slate-200">R$ {faturaMes.toFixed(2)}</span>
                              </div>
                              <div className="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden mb-3">
                                <div className={`h-full rounded-full ${progress > 85 ? 'bg-rose-500' : 'bg-purple-500'}`} style={{ width: `${progress}%` }}></div>
                              </div>
                              <div className="flex justify-between text-[10px] text-slate-500">
                                <span>Disponível: <strong className="text-emerald-400">R$ {limiteDisponivel > 0 ? limiteDisponivel.toFixed(2) : '0.00'}</strong></span>
                                <span>Total: R$ {card.limite.toFixed(2)}</span>
                              </div>
                              
                              <div className="mt-4 pt-4 border-t border-slate-800 flex justify-end gap-2">
                                <button onClick={() => handleDeleteCard(card.id)} className="p-1.5 text-slate-500 hover:text-rose-400 hover:bg-rose-500/10 rounded transition-colors text-xs flex items-center gap-1">
                                  <Trash2 className="w-3 h-3"/> Remover
                                </button>
                              </div>
                            </div>
                          </div>
                        );
                      })
                    )}
                  </div>
                </div>
              )}
            </div>
          </main>

          {}
          
          {/* MODAL: NOVO LANÇAMENTO */}
          {showAddTxModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex justify-center items-center p-4">
              <div className="bg-slate-900 border border-slate-700 shadow-2xl rounded-2xl w-full max-w-2xl overflow-hidden animate-fade-in flex flex-col max-h-[90vh]">
                <div className="bg-slate-950 px-6 py-4 border-b border-slate-800 flex justify-between items-center shrink-0">
                  <h3 className="font-bold text-lg text-white flex items-center gap-2">
                    <Plus className="w-5 h-5 text-indigo-400" />
                    Novo Lançamento
                  </h3>
                  <button onClick={() => setShowAddTxModal(false)} className="text-slate-400 hover:text-white transition-colors bg-slate-800 p-1 rounded-full"><X className="w-5 h-5"/></button>
                </div>
                
                <form onSubmit={handleCreateTransactionSubmit} className="p-6 overflow-y-auto space-y-4">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-1">Data</label>
                      <input type="date" required className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white text-sm focus:border-indigo-500 focus:outline-none"
                        value={newTxForm.data} onChange={e => setNewTxForm({...newTxForm, data: e.target.value})} />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-1">Origem / Categoria</label>
                      <select required className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white text-sm focus:border-indigo-500 focus:outline-none"
                        value={newTxForm.origem} onChange={e => setNewTxForm({...newTxForm, origem: e.target.value, classificacao: CATEGORIES_MAP[e.target.value][0]})}>
                        {Object.keys(CATEGORIES_MAP).map(cat => <option key={cat} value={cat}>{cat}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-1">Classificação</label>
                      <select required className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white text-sm focus:border-indigo-500 focus:outline-none"
                        value={newTxForm.classificacao} onChange={e => setNewTxForm({...newTxForm, classificacao: e.target.value})}>
                        {(CATEGORIES_MAP[newTxForm.origem] || []).map(cls => <option key={cls} value={cls}>{cls}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-1">Conta Bancária</label>
                      <select required className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white text-sm focus:border-indigo-500 focus:outline-none"
                        value={newTxForm.conta} onChange={e => setNewTxForm({...newTxForm, conta: e.target.value})}>
                        <option value="Conta Talyson">Conta Talyson</option>
                        <option value="Conta Karla">Conta Karla</option>
                        <option value="Ambos">Ambos</option>
                        <option value="Outro">Outro</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-1">Operação</label>
                      <select required className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white text-sm focus:border-indigo-500 focus:outline-none"
                        value={newTxForm.operacao} onChange={e => {
                          const op = e.target.value;
                          setNewTxForm({...newTxForm, operacao: op, cartaoId: op === 'Crédito' ? (cards[0]?.id || '') : ''})
                        }}>
                        <option value="Pix">Pix</option>
                        <option value="Débito">Débito</option>
                        <option value="Crédito">Crédito</option>
                        <option value="Dinheiro">Dinheiro</option>
                        <option value="Transferência">Transferência</option>
                      </select>
                    </div>

                    {newTxForm.operacao === 'Crédito' && (
                      <div>
                        <label className="block text-xs font-semibold text-purple-400 mb-1">Cartão de Crédito</label>
                        <select required className="w-full bg-purple-950/30 border border-purple-500/50 rounded-lg px-3 py-2 text-white text-sm focus:border-purple-500 focus:outline-none"
                          value={newTxForm.cartaoId} onChange={e => setNewTxForm({...newTxForm, cartaoId: e.target.value})}>
                          <option value="">Selecione um cartão...</option>
                          {cards.map(c => <option key={c.id} value={c.id}>{c.nome}</option>)}
                        </select>
                      </div>
                    )}
                    
                    <div>
                      <label className="block text-xs font-semibold text-emerald-400 mb-1">Entrada (R$) - Opcional</label>
                      <input type="number" step="0.01" min="0" placeholder="0.00" className="w-full bg-emerald-950/20 border border-emerald-900/50 rounded-lg px-3 py-2 text-emerald-300 text-sm focus:border-emerald-500 focus:outline-none"
                        value={newTxForm.entrada} onChange={e => setNewTxForm({...newTxForm, entrada: e.target.value})} />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-rose-400 mb-1">Saída (R$) - Opcional</label>
                      <input type="number" step="0.01" min="0" placeholder="0.00" className="w-full bg-rose-950/20 border border-rose-900/50 rounded-lg px-3 py-2 text-rose-300 text-sm focus:border-rose-500 focus:outline-none"
                        value={newTxForm.saida} onChange={e => setNewTxForm({...newTxForm, saida: e.target.value})} />
                    </div>
                    
                    <div className="sm:col-span-2">
                      <label className="block text-xs font-semibold text-slate-400 mb-1">Comentário / Descrição</label>
                      <input type="text" placeholder="Ex: Compra no mercantil..." required className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white text-sm focus:border-indigo-500 focus:outline-none"
                        value={newTxForm.comentario} onChange={e => setNewTxForm({...newTxForm, comentario: e.target.value})} />
                    </div>
                    
                    <div className="sm:col-span-2">
                      <label className="block text-xs font-semibold text-slate-400 mb-1">Indivíduo Relacionado</label>
                      <select required className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white text-sm focus:border-indigo-500 focus:outline-none"
                        value={newTxForm.individuo} onChange={e => setNewTxForm({...newTxForm, individuo: e.target.value})}>
                        <option value="Talyson">Talyson</option>
                        <option value="Karla">Karla</option>
                        <option value="Ambos">Ambos</option>
                        <option value="Outro">Outro</option>
                      </select>
                    </div>
                  </div>
                  
                  <div className="pt-4 mt-4 border-t border-slate-800 flex justify-end gap-3">
                    <button type="button" onClick={() => setShowAddTxModal(false)} className="px-4 py-2 text-sm text-slate-300 hover:text-white transition-colors">Cancelar</button>
                    <button type="submit" className="px-6 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold rounded-lg flex items-center gap-2 shadow-lg shadow-indigo-600/20 transition-all">
                      <Save className="w-4 h-4" /> Salvar Lançamento
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {}
          {/* MODAL: NOVO CARTÃO */}
          {showAddCard && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex justify-center items-center p-4">
              <div className="bg-slate-900 border border-slate-700 shadow-2xl rounded-2xl w-full max-w-lg overflow-hidden animate-fade-in">
                <div className="bg-slate-950 px-6 py-4 border-b border-slate-800 flex justify-between items-center">
                  <h3 className="font-bold text-lg text-white flex items-center gap-2">
                    <CreditCard className="w-5 h-5 text-purple-400" />
                    Novo Cartão de Crédito
                  </h3>
                  <button onClick={() => setShowAddCard(false)} className="text-slate-400 hover:text-white transition-colors bg-slate-800 p-1 rounded-full"><X className="w-5 h-5"/></button>
                </div>
                
                <form onSubmit={handleAddCardSubmit} className="p-6 space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1">Nome do Cartão (Apelido)</label>
                    <input type="text" required placeholder="Ex: Nubank Principal" className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white text-sm focus:border-purple-500 focus:outline-none"
                      value={newCard.nome} onChange={e => setNewCard({...newCard, nome: e.target.value})} />
                  </div>
                  
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-1">Titular</label>
                      <select required className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white text-sm focus:border-purple-500 focus:outline-none"
                        value={newCard.titular} onChange={e => setNewCard({...newCard, titular: e.target.value})}>
                        <option value="Talyson">Talyson</option>
                        <option value="Karla">Karla</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-1">Limite Total (R$)</label>
                      <input type="number" required step="0.01" min="0" placeholder="0.00" className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white text-sm focus:border-purple-500 focus:outline-none"
                        value={newCard.limite} onChange={e => setNewCard({...newCard, limite: e.target.value})} />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-1">Dia Fechamento</label>
                      <input type="number" required min="1" max="31" placeholder="Ex: 5" className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white text-sm focus:border-purple-500 focus:outline-none"
                        value={newCard.diaFechamento} onChange={e => setNewCard({...newCard, diaFechamento: e.target.value})} />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-1">Dia Vencimento</label>
                      <input type="number" required min="1" max="31" placeholder="Ex: 12" className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white text-sm focus:border-purple-500 focus:outline-none"
                        value={newCard.diaVencimento} onChange={e => setNewCard({...newCard, diaVencimento: e.target.value})} />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-2">Cor do Cartão</label>
                    <div className="flex gap-2 flex-wrap">
                      {GRADIENTS.map(grad => (
                        <button
                          key={grad.value}
                          type="button"
                          onClick={() => setNewCard({...newCard, cor: grad.value})}
                          className={`w-8 h-8 rounded-full bg-gradient-to-br ${grad.value} ring-2 ring-offset-2 ring-offset-slate-900 transition-all ${newCard.cor === grad.value ? 'ring-white scale-110' : 'ring-transparent hover:scale-105'}`}
                          title={grad.label}
                        ></button>
                      ))}
                    </div>
                  </div>
                  
                  <div className="pt-4 mt-4 border-t border-slate-800 flex justify-end gap-3">
                    <button type="button" onClick={() => setShowAddCard(false)} className="px-4 py-2 text-sm text-slate-300 hover:text-white transition-colors">Cancelar</button>
                    <button type="submit" className="px-6 py-2 bg-purple-600 hover:bg-purple-500 text-white text-sm font-semibold rounded-lg flex items-center gap-2 shadow-lg shadow-purple-600/20 transition-all">
                      <Save className="w-4 h-4" /> Cadastrar Cartão
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {}
          {/* CUSTOM CONFIRM MODAL */}
          {confirmModal.isOpen && (
            <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fade-in">
              <div className="bg-slate-900 border border-slate-700 rounded-xl max-w-sm w-full p-6 shadow-2xl">
                <div className="flex items-center gap-3 mb-4 text-rose-400">
                  <AlertTriangle className="w-6 h-6" />
                  <h3 className="text-lg font-bold">{confirmModal.title}</h3>
                </div>
                <p className="text-slate-300 text-sm mb-6">{confirmModal.message}</p>
                <div className="flex justify-end gap-3">
                  <button onClick={() => setConfirmModal({ isOpen: false })} className="px-4 py-2 text-sm font-semibold text-slate-400 hover:text-white transition-colors">
                    Cancelar
                  </button>
                  <button onClick={confirmModal.onConfirm} className="px-4 py-2 text-sm font-semibold bg-rose-600 hover:bg-rose-500 text-white rounded-lg transition-colors shadow-lg shadow-rose-600/20">
                    Confirmar Exclusão
                  </button>
                </div>
              </div>
            </div>
          )}

          {}
          {/* TOAST NOTIFICATION */}
          {toast && (
            <div className="fixed bottom-6 right-6 z-[100] animate-fade-in-up">
              <div className={`flex items-center gap-3 px-4 py-3 rounded-xl shadow-2xl border ${toast.type === 'success' ? 'bg-emerald-950/80 border-emerald-500/30 text-emerald-100' : 'bg-rose-950/80 border-rose-500/30 text-rose-100'} backdrop-blur-md`}>
                {toast.type === 'success' ? <CheckCircle2 className="w-5 h-5 text-emerald-400" /> : <AlertTriangle className="w-5 h-5 text-rose-400" />}
                <p className="text-sm font-medium">{toast.message}</p>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
